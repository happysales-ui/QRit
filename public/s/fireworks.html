<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>8월의 첫눈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #070b16;
    font-family: 'Gowun Batang', serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }
  #skybg {
    position: fixed; inset: 0;
    background: linear-gradient(to bottom, #070b16 0%, #0e1530 55%, #1a2547 100%);
    touch-action: none;
  }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #message {
    position: fixed;
    left: 50%; top: 28%;
    transform: translate(-50%, -50%);
    width: min(84vw, 360px);
    text-align: center;
    color: rgba(242, 245, 253, 0.93);
    font-size: 1.08rem; line-height: 1.95; letter-spacing: 0.04em;
    opacity: 0;
    transition: opacity 2.6s ease;
    pointer-events: none;
    text-shadow: 0 0 20px rgba(150, 170, 255, 0.4), 0 0 40px rgba(7, 11, 22, 0.9);
    word-break: keep-all;
  }
  #message.visible { opacity: 1; }
  #hint {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
    transform: translateX(-50%);
    color: rgba(242, 245, 253, 0.45);
    font-size: 0.8rem; letter-spacing: 0.14em;
    opacity: 0;
    animation: hintFade 8s ease 2s forwards;
    pointer-events: none;
    white-space: nowrap;
  }
  @keyframes hintFade {
    0% { opacity: 0; } 20% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; }
  }
  #sign {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    transform: translateX(-50%);
    color: rgba(242, 245, 253, 0.22);
    font-size: 0.68rem; letter-spacing: 0.3em;
    pointer-events: none;
    font-family: sans-serif;
  }
</style>
</head>
<body>
<div id="skybg"></div>
<canvas id="fx"></canvas>
<canvas id="snowc"></canvas>
<div id="message"></div>
<div id="hint">첫눈 속에 불꽃을 숨겨두었어요 · 하늘을 눌러보세요</div>
<div id="sign">QRIT</div>
<script>
(function () {
  const fxCanvas = document.getElementById('fx');
  const fx = fxCanvas.getContext('2d');
  const snowCanvas = document.getElementById('snowc');
  const sc = snowCanvas.getContext('2d');
  const messageEl = document.getElementById('message');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    for (const [cv, cx] of [[fxCanvas, fx], [snowCanvas, sc]]) {
      cv.width = W * DPR;
      cv.height = H * DPR;
      cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    fx.clearRect(0, 0, W, H);
  }
  resize();
  window.addEventListener('resize', resize);
  /* ---------- 겨울의 문장 ---------- */
  const messages = [
    '한여름의 당신에게, 조금 이른 첫눈을',
    '눈이 내리면 세상이 잠깐 조용해져요',
    '오늘의 소란은 여기 묻어두고 가요',
    '수고한 마음 위에 눈이 소복소복',
    '겨울처럼, 쉬어가도 괜찮아요',
    '첫눈처럼 좋은 일이 당신에게 내리기를',
    '녹지 않는 안부를 보냅니다',
    '이 고요는 당신을 위해 준비했어요'
  ];
  let msgOrder = shuffle([...messages.keys()]);
  let msgIdx = 0;
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  let msgTimer = null;
  function showMessage() {
    messageEl.textContent = messages[msgOrder[msgIdx]];
    msgIdx = (msgIdx + 1) % msgOrder.length;
    if (msgIdx === 0) msgOrder = shuffle(msgOrder);
    messageEl.classList.add('visible');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => messageEl.classList.remove('visible'), 5600);
  }
  /* ---------- 별 ---------- */
  const stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random(), y: Math.random() * 0.85,
      r: Math.random() * 1.1 + 0.3,
      base: Math.random() * 0.4 + 0.15,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.5 + 0.15
    });
  }
  /* ---------- 눈 ---------- */
  const flakes = [];
  const FLAKE_COUNT = reduceMotion ? 0 : 130;
  for (let i = 0; i < FLAKE_COUNT; i++) {
    flakes.push(newFlake(true));
  }
  function newFlake(anywhere) {
    const depth = Math.random();           /* 0 멀리 ~ 1 가까이 */
    return {
      x: Math.random() * 1.1 - 0.05,
      y: anywhere ? Math.random() : -0.03,
      depth,
      r: 0.8 + depth * 2.6,
      vy: (0.25 + depth * 0.65),
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.4 + Math.random() * 0.6,
      swayAmp: 0.15 + depth * 0.45,
      alpha: 0.35 + depth * 0.55
    };
  }
  /* ---------- 불꽃 팔레트: 눈은 희게, 불꽃은 선명하게 ---------- */
  const PALETTES = [
    ['#ff8a8a', '#ffc2c2', '#ff5d5d'],   /* 연빨강 */
    ['#8ee6a0', '#c8f5d0', '#5dd47a'],   /* 연초록 */
    ['#ffd166', '#ffedb0', '#ff9e3d'],   /* 골드 */
    ['#ff8fd0', '#ffc6e8', '#ff5daf'],   /* 핑크 */
    ['#7fd8f0', '#c0f0ff', '#4cc9f0'],   /* 하늘빛 */
    ['#c9a0ff', '#e8d4ff', '#a86ef0'],   /* 라벤더 */
    ['#ffb36b', '#ffdcb8', '#ff8c2e']    /* 코랄 오렌지 */
  ];
  const GOLD = ['#ffd980', '#ffedb8', '#ffbf50'];
  const ICE = ['#e8f2ff', '#cfe4ff', '#b8d4ff', '#dce9ff'];
  const HEART_PINK = ['#ff6b8a', '#ff9eb5', '#ff4d6d', '#ffc2d0'];
  const rockets = [];
  const particles = [];
  const flashes = [];
  /* Cap for mid-phone FPS — multi-stage shells share this budget */
  const MAX_PARTICLES = 1150;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  /* Per-shell knobs so consecutive taps don't feel cloned */
  function shellFeel() {
    return {
      speed: rand(0.82, 1.24),
      gravity: rand(0.82, 1.28),
      friction: rand(0.978, 0.993),
      decay: rand(0.82, 1.22),
      trail: Math.random() < 0.58
    };
  }
  function roomFor(n) {
    return particles.length + n <= MAX_PARTICLES;
  }
  function addP(x, y, vx, vy, color, opts) {
    if (particles.length >= MAX_PARTICLES) return false;
    particles.push(Object.assign({
      x, y, vx, vy, color,
      color2: null,
      life: 1, decay: 0.007 + Math.random() * 0.003,
      r: 1.3 + Math.random() * 1.4,
      gravity: 0.011, friction: 0.986,
      flicker: false, sub: null, subAt: null,
      drift: (Math.random() - 0.5) * 0.008,
      trailGlow: false
    }, opts || {}));
    return true;
  }
  /*
   * Type-specific bloom — soft by default; bright reserved for dopamine moments.
   * opts: intensity, fade, grow, soft, whiteCore, coreScale
   */
  function flash(x, y, color, size, opts) {
    opts = opts || {};
    const maxR = size || 64;
    const intensity = opts.intensity != null ? opts.intensity : 0.4;
    const fade = opts.fade != null ? opts.fade : 0.095;
    const grow = opts.grow != null ? opts.grow : 0.34;
    flashes.push({
      x, y, r: 0, maxR, life: 1, color,
      intensity, fade, grow, soft: !!opts.soft
    });
    if (opts.whiteCore) {
      const cs = opts.coreScale != null ? opts.coreScale : 0.18;
      flashes.push({
        x, y, r: 0, maxR: maxR * cs, life: 1, color: '#ffffff',
        intensity: intensity * (opts.soft ? 0.42 : 0.62), fade: fade * 1.35,
        grow: grow * 1.25, soft: false
      });
    }
  }
  /* Satisfying bright pop — finale / stage-2 / crossette / occasional peony */
  function brightFlash(x, y, color, size) {
    flash(x, y, color, size || 96, {
      intensity: 0.78, soft: false, whiteCore: true, coreScale: 0.24,
      fade: 0.13, grow: 0.46
    });
  }
  /* Spherical peony — soft by default; bright when scale is big or opts.bright */
  function peonyBurst(x, y, palette, scale, feel, opts) {
    const s = scale || 1;
    const f = feel || shellFeel();
    const o = opts || {};
    const pickC = () => pick(palette);
    const bright = o.bright || s >= 1.2 || Math.random() < 0.22;
    if (bright) {
      brightFlash(x, y, palette[0], 86 * s);
    } else {
      flash(x, y, palette[0], 52 * s, {
        intensity: 0.36, soft: true, whiteCore: true, coreScale: 0.16, fade: 0.11
      });
    }
    const n = Math.floor(78 * s);
    const speed = 1.7 * s * f.speed;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.12;
      const sp = speed * (0.5 + Math.random() * 0.6);
      addP(x, y, Math.cos(a) * sp, Math.sin(a) * sp, pickC(), {
        decay: (0.0045 + Math.random() * 0.002) * f.decay,
        gravity: 0.009 * f.gravity, friction: f.friction,
        r: 1.4 + Math.random() * 1.1 * s, trailGlow: f.trail
      });
    }
    for (let i = 0; i < Math.floor(12 * s); i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.2 + Math.random() * 0.5 * s;
      addP(x, y, Math.cos(a) * sp, Math.sin(a) * sp, '#ffffff', {
        decay: 0.018, r: 0.9, flicker: true
      });
    }
  }
  /* Hanging willow — long golden/color trails, almost no flash */
  function willowBurst(x, y, palette, scale, feel) {
    const s = scale || 1;
    const f = feel || shellFeel();
    flash(x, y, palette[0], 36 * s, { intensity: 0.24, soft: true, fade: 0.13 });
    const n = Math.floor(68 * s);
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.18;
      const sp = (1.05 + Math.random() * 0.95) * s * f.speed;
      addP(x, y, Math.cos(a) * sp * 0.5, Math.sin(a) * sp * 0.3 - 0.25, pick(palette), {
        decay: (0.002 + Math.random() * 0.0014) * f.decay,
        gravity: 0.024 * f.gravity, friction: 0.994,
        r: 1.05 + Math.random(), flicker: true, trailGlow: true
      });
    }
  }
  /* Flat ring — Saturn / stage-2 ring silhouette */
  function ringBurst(x, y, palette, scale, feel) {
    const s = scale || 1;
    const f = feel || shellFeel();
    flash(x, y, palette[0], 42 * s, {
      intensity: 0.3, soft: true, whiteCore: true, coreScale: 0.12, fade: 0.1
    });
    const n = Math.floor(100 * s);
    const speed = 2.2 * s * f.speed;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n;
      const jitter = 0.9 + Math.random() * 0.14;
      addP(x, y, Math.cos(a) * speed * jitter, Math.sin(a) * speed * jitter * 0.38, pick(palette), {
        decay: (0.0048 + Math.random() * 0.002) * f.decay,
        gravity: 0.006 * f.gravity, friction: f.friction,
        r: 1.45 + Math.random() * 0.6, trailGlow: true
      });
    }
  }
  /* Delayed hanging glitter after the main break (brocade) */
  function brocadeSparkles(x, y, palette) {
    const n = 48 + Math.floor(Math.random() * 30);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.3 + Math.random() * 1.25;
      addP(x + (Math.random() - 0.5) * 18, y + (Math.random() - 0.5) * 14,
        Math.cos(a) * sp, Math.sin(a) * sp * 0.5 + 0.12, pick(palette), {
          decay: 0.0026 + Math.random() * 0.002,
          gravity: 0.014 + Math.random() * 0.01,
          friction: 0.991, r: 1 + Math.random(),
          flicker: true, trailGlow: true
        });
    }
  }
  /* Crossette secondary: 4-way split from outer particle (the interesting part) */
  function crossettePop(x, y, palette) {
    const base = Math.random() * (Math.PI / 2);
    for (let k = 0; k < 4; k++) {
      const a = base + (Math.PI / 2) * k + rand(-0.12, 0.12);
      const s = 1.35 + Math.random() * 0.9;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, pick(palette), {
        decay: 0.011 + Math.random() * 0.004, r: 1.15 + Math.random() * 0.5,
        flicker: true, trailGlow: true, gravity: 0.012
      });
    }
  }
  function miniBurst(x, y, palette) {
    const n = 22 + Math.floor(Math.random() * 10);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 0.55 + Math.random() * 1.1;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, pick(palette), {
        decay: 0.012, r: 1.05 + Math.random(), flicker: true
      });
    }
  }
  /* ========== 불꽃 타입 — each has its own flash + motion identity ========== */
  /* Cool blue-white crystalline, slow drift, soft ice bloom */
  function snowflakeBurst(x, y, feel) {
    const f = feel || shellFeel();
    flash(x, y, '#9ec8ff', 58, { intensity: 0.26, soft: true, fade: 0.08, grow: 0.22 });
    const main = pick(ICE);
    const armSp = 2.55 * f.speed;
    for (let arm = 0; arm < 6; arm++) {
      const a = (Math.PI * 2 * arm) / 6 - Math.PI / 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      for (let i = 1; i <= 16; i++) {
        const s = (i / 16) * armSp;
        addP(x, y, ca * s, sa * s, main, {
          decay: 0.0042 * f.decay, gravity: 0.0032 * f.gravity,
          friction: 0.992, r: 1.55
        });
      }
      for (const bf of [0.35, 0.55, 0.78]) {
        for (const side of [-1, 1]) {
          const ba = a + side * (Math.PI / 5);
          const bca = Math.cos(ba), bsa = Math.sin(ba);
          for (let j = 1; j <= 5; j++) {
            addP(x, y,
              ca * bf * armSp * 0.92 + bca * (j / 5) * 0.8,
              sa * bf * armSp * 0.92 + bsa * (j / 5) * 0.8,
              main, {
                decay: 0.0042 * f.decay, gravity: 0.0032 * f.gravity,
                friction: 0.992, r: 1.15
              });
          }
        }
      }
    }
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * 0.45;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, '#dceeff', {
        decay: 0.0038, gravity: 0.002, friction: 0.996, r: 1.25, flicker: true
      });
    }
  }
  /* Soft pink/red petals — slower expand so full silhouette reads longer */
  function heartBurst(x, y, palette, feel) {
    const f = feel || shellFeel();
    const petals = Math.random() < 0.7 ? HEART_PINK : palette;
    const N = 128;
    const sparkN = 8;
    if (!roomFor(N + sparkN)) return;
    flash(x, y, petals[0], 48, { intensity: 0.3, soft: true, fade: 0.09, grow: 0.24 });
    /* Milder speed + tip damp so bottom doesn't race away from lobes */
    const scale = 1.72 * Math.min(f.speed, 1.08);
    for (let i = 0; i < N; i++) {
      const t = (Math.PI * 2 * i) / N;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      const nx = hx / 16;
      const ny = hy / 16;
      /* Tip (down) dampened; upper lobes slightly boosted */
      const yMul = ny > 0 ? 0.66 : 1.08;
      addP(x, y, nx * scale, ny * scale * yMul, pick(petals), {
        decay: 0.0036 * f.decay, gravity: 0.0036 * f.gravity,
        friction: Math.min(0.994, f.friction + 0.004),
        r: 1.75 + Math.random() * 0.45
      });
    }
    for (let i = 0; i < sparkN; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 0.15 + Math.random() * 0.35;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, '#ffd0dc', {
        decay: 0.014, r: 1, flicker: true
      });
    }
  }
  /* Filled-arm star — denser edges, slower expand (snowflake-quality silhouette) */
  function starBurst(x, y, palette, feel) {
    const f = feel || shellFeel();
    const samples = 20;
    const armFill = 8;
    const sparkN = 12;
    const need = 10 * samples + 5 * armFill + sparkN;
    if (!roomFor(need)) return;
    flash(x, y, palette[0], 42, {
      intensity: 0.34, soft: true, whiteCore: true, coreScale: 0.14, fade: 0.11, grow: 0.3
    });
    const points = [];
    for (let k = 0; k < 5; k++) {
      const outer = -Math.PI / 2 + (Math.PI * 2 * k) / 5;
      const inner = outer + Math.PI / 5;
      points.push([Math.cos(outer), Math.sin(outer), 1]);
      points.push([Math.cos(inner), Math.sin(inner), 0.42]);
    }
    const stretch = 1.85 * Math.min(f.speed, 1.1);
    for (let seg = 0; seg < 10; seg++) {
      const [ax, ay, ar] = points[seg];
      const [bx, by, br] = points[(seg + 1) % 10];
      for (let j = 0; j < samples; j++) {
        const t = j / samples;
        const px = (ax * ar) * (1 - t) + (bx * br) * t;
        const py = (ay * ar) * (1 - t) + (by * br) * t;
        addP(x, y, px * stretch, py * stretch, pick(palette), {
          decay: 0.0044 * f.decay, gravity: 0.0028 * f.gravity,
          friction: Math.min(0.994, f.friction + 0.004), r: 1.55
        });
      }
    }
    /* Fill each arm from center → tip so outline doesn't look broken */
    for (let k = 0; k < 5; k++) {
      const [ox, oy] = points[k * 2];
      for (let j = 1; j <= armFill; j++) {
        const t = j / armFill;
        addP(x, y, ox * stretch * t, oy * stretch * t, pick(palette), {
          decay: 0.0042 * f.decay, gravity: 0.0028 * f.gravity,
          friction: Math.min(0.994, f.friction + 0.004), r: 1.35 + t * 0.3
        });
      }
    }
    for (let i = 0; i < sparkN; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 0.45 + Math.random() * 0.9;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, '#ffffff', {
        decay: 0.018 + Math.random() * 0.008, r: 0.8, flicker: true
      });
    }
  }
  /* Trailing spiral arms — motion identity, tiny colored tip flash */
  function spiralBurst(x, y, palette, feel) {
    const f = feel || shellFeel();
    flash(x, y, palette[0], 34, { intensity: 0.28, soft: true, fade: 0.12 });
    const twist = rand(2.4, 3.4);
    for (let a = 0; a < 4; a++) {
      const armColor = palette[a % palette.length];
      const armBase = (Math.PI * 2 * a) / 4 + rand(0, 0.4);
      for (let i = 0; i < 38; i++) {
        const t = i / 38;
        const angle = armBase + t * twist;
        const speed = (0.5 + t * 2.4) * f.speed;
        addP(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, armColor, {
          decay: 0.0046 * f.decay, gravity: 0.0035 * f.gravity,
          friction: 0.98 + (f.friction - 0.978) * 0.4,
          r: 1.15 + t * 1.35, trailGlow: true
        });
      }
    }
  }
  /* Saturn: dense core globe + clear equatorial ring */
  function saturnBurst(x, y, palette, feel) {
    const f = feel || shellFeel();
    flash(x, y, GOLD[0], 44, {
      intensity: 0.34, soft: true, whiteCore: true, coreScale: 0.14, fade: 0.1
    });
    const coreN = 36;
    for (let i = 0; i < coreN; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (0.35 + Math.random() * 0.85) * f.speed;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, pick(GOLD), {
        decay: 0.007 * f.decay, gravity: 0.008 * f.gravity, r: 1.3
      });
    }
    const ringN = 110;
    const ringSp = 2.35 * f.speed;
    const tilt = 0.32;
    for (let i = 0; i < ringN; i++) {
      const a = (Math.PI * 2 * i) / ringN;
      const jitter = 0.94 + Math.random() * 0.1;
      addP(x, y,
        Math.cos(a) * ringSp * jitter,
        Math.sin(a) * ringSp * jitter * tilt,
        pick(palette), {
          decay: 0.0044 * f.decay, gravity: 0.005 * f.gravity,
          friction: f.friction, r: 1.5 + Math.random() * 0.5, trailGlow: true
        });
    }
  }
  /* Color-morph chrys: gold → pink/green → red */
  function shiftChrys(x, y, feel) {
    const f = feel || shellFeel();
    const morph = Math.random() < 0.5
      ? { from: '#ffd166', mid: '#ff8fd0', to: '#ff5d5d' }
      : { from: '#ffd980', mid: '#8ee6a0', to: '#ff6b6b' };
    flash(x, y, morph.from, 50, { intensity: 0.34, soft: true, fade: 0.09 });
    const n = 112;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.08;
      const s = (1.9 + Math.random() * 0.6) * f.speed;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, morph.from, {
        color2: morph.to, colorMid: morph.mid,
        decay: 0.0036 * f.decay, gravity: 0.008 * f.gravity,
        friction: f.friction, trailGlow: true, r: 1.7
      });
    }
  }
  /* Outer particles delay-pop into 4-way splits — bright main break */
  function crossette(x, y, palette, scale, feel) {
    const sc = scale || 1;
    const f = feel || shellFeel();
    brightFlash(x, y, palette[0], 72 * sc);
    const n = Math.floor(72 * sc);
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.1;
      const s = 1.85 * sc * f.speed * (0.55 + Math.random() * 0.55);
      const isOuter = s > 1.35 * sc * f.speed;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, pick(palette), {
        decay: 0.0065 * f.decay, gravity: 0.01 * f.gravity, friction: f.friction,
        sub: isOuter && Math.random() < 0.72 ? palette : null,
        subAt: isOuter ? rand(0.42, 0.68) : null,
        r: 1.35
      });
    }
  }
  /* Long golden trails falling — almost no big flash */
  function goldenWaterfall(cx, cy, feel) {
    const f = feel || shellFeel();
    flash(cx, cy, '#ffd980', 28, { intensity: 0.18, soft: true, fade: 0.14 });
    const span = Math.min(W * 0.78, 460);
    const n = 105;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const px = cx - span / 2 + span * t;
      const arc = Math.sin(t * Math.PI) * 32;
      addP(px, cy - arc, (Math.random() - 0.5) * 0.16, 0.1 + Math.random() * 0.32,
        pick(GOLD), {
          decay: (0.0022 + Math.random() * 0.001) * f.decay,
          gravity: 0.021 * f.gravity, friction: 0.993,
          flicker: true, r: 1.25 + Math.random(), trailGlow: true
        });
    }
  }
  /* ---------- 타입 순환 (눈송이 불꽃이 첫 번째) ---------- */
  const TAP_TYPES = ['snowflake', 'heart', 'shift', 'star', 'spiral', 'saturn', 'crossette', 'waterfall'];
  /* Stage-2 uses a DIFFERENT shape/palette — not a brighter clone of stage-1 */
  const STAGE2_MAP = {
    snowflake: ['willow', 'peony', 'ring', 'star'],
    /* Gentler secondaries so heart/star silhouette isn't erased instantly */
    heart: ['willow', 'ring', 'spiral', 'peony'],
    star: ['willow', 'ring', 'spiral', 'peony'],
    spiral: ['peony', 'star', 'ring', 'saturn'],
    saturn: ['peony', 'willow', 'crossette', 'star'],
    shift: ['peony', 'ring', 'willow', 'heart'],
    crossette: ['peony', 'star', 'saturn', 'ring'],
    waterfall: ['willow', 'peony', 'ring', 'saturn']
  };
  let tapQueue = [...TAP_TYPES];   /* 첫 바퀴는 고정 순서: 첫 탭은 반드시 눈송이 */
  let tapIdx = 0;
  function nextTapType() {
    const t = tapQueue[tapIdx];
    tapIdx++;
    if (tapIdx >= tapQueue.length) { tapQueue = shuffle([...TAP_TYPES]); tapIdx = 0; }
    return t;
  }
  function fireType(type, x, y, palette, feel) {
    const pal = palette || pick(PALETTES);
    const f = feel || shellFeel();
    if (type === 'snowflake') snowflakeBurst(x, y, f);
    else if (type === 'heart') heartBurst(x, y, pal, f);
    else if (type === 'star') starBurst(x, y, pal, f);
    else if (type === 'spiral') spiralBurst(x, y, pal, f);
    else if (type === 'saturn') saturnBurst(x, y, pal, f);
    else if (type === 'shift') shiftChrys(x, y, f);
    else if (type === 'waterfall') goldenWaterfall(x, Math.min(y, H * 0.4), f);
    else if (type === 'peony') peonyBurst(x, y, pal, 1, f);
    else if (type === 'willow') willowBurst(x, y, pal, 1, f);
    else if (type === 'ring') ringBurst(x, y, pal, 1, f);
    else crossette(x, y, pal, 1, f);
    return pal;
  }
  function fireStage2(kind, x, y, palette, scale, feel, bright) {
    if (kind === 'peony') peonyBurst(x, y, palette, scale, feel, { bright: !!bright });
    else if (kind === 'willow') willowBurst(x, y, palette, scale * 0.95, feel);
    else if (kind === 'ring') ringBurst(x, y, palette, scale, feel);
    else if (kind === 'crossette') crossette(x, y, palette, scale, feel);
    else if (kind === 'star') starBurst(x, y, palette, feel);
    else if (kind === 'spiral') spiralBurst(x, y, palette, feel);
    else if (kind === 'saturn') saturnBurst(x, y, palette, feel);
    else if (kind === 'heart') heartBurst(x, y, palette, feel);
    else peonyBurst(x, y, palette, scale, feel, { bright: !!bright });
  }
  /*
   * Multi-stage shell:
   *  1) typed first bang
   *  2) different-shape secondary (later/farther after delicate shapes)
   *  3) optional brocade glitter
   */
  function fireShell(type, x, y) {
    const feel = shellFeel();
    const palette = pick(PALETTES);
    fireType(type, x, y, palette, feel);
    if (reduceMotion) return;
    const delicate = type === 'heart' || type === 'star' || type === 'snowflake';
    const delay2 = delicate ? (720 + Math.random() * 480) : (350 + Math.random() * 350);
    const scale2 = delicate
      ? (0.88 + Math.random() * 0.32)
      : (1.25 + Math.random() * 0.45);
    const ox = (Math.random() - 0.5) * Math.min(W * (delicate ? 0.14 : 0.06), delicate ? 110 : 48);
    const oy = (Math.random() - 0.5) * Math.min(H * (delicate ? 0.1 : 0.04), delicate ? 70 : 32);
    const sx = Math.max(W * 0.06, Math.min(W * 0.94, x + ox));
    const sy = Math.max(H * 0.08, Math.min(H * 0.7, y + oy));
    const stage2Kind = pick(STAGE2_MAP[type] || ['peony', 'ring']);
    const pal2 = Math.random() < 0.38 ? GOLD
      : (Math.random() < 0.45 ? palette : pick(PALETTES));
    setTimeout(() => {
      if (particles.length > MAX_PARTICLES * 0.92) return;
      /* Bigger-bang stage-2: bright peony / crossette, or a pop on large non-delicate shells */
      const bangBright = scale2 >= 1.2 || stage2Kind === 'peony' || stage2Kind === 'crossette';
      fireStage2(stage2Kind, sx, sy, pal2, scale2, shellFeel(), bangBright);
      if (bangBright && !delicate && stage2Kind !== 'peony' && stage2Kind !== 'crossette'
          && stage2Kind !== 'willow') {
        brightFlash(sx, sy, pal2[0], 78 * scale2);
      }
      /* Occasional twin accent — different kind again */
      if (Math.random() < (delicate ? 0.1 : 0.2) && particles.length < MAX_PARTICLES * 0.75) {
        const tx = Math.max(W * 0.08, Math.min(W * 0.92, sx + (Math.random() - 0.5) * 90));
        const ty = Math.max(H * 0.1, Math.min(H * 0.68, sy + (Math.random() - 0.5) * 60));
        const twin = pick(['peony', 'ring', 'willow', 'star']);
        setTimeout(() => fireStage2(twin, tx, ty, Math.random() < 0.5 ? GOLD : pal2,
          0.95 + Math.random() * 0.3, shellFeel(), twin === 'peony'), 90 + Math.random() * 140);
      }
    }, delay2);
    if (Math.random() < (delicate ? 0.28 : 0.45)) {
      const delay3 = delay2 + 220 + Math.random() * 380;
      setTimeout(() => {
        if (particles.length > MAX_PARTICLES * 0.9) return;
        brocadeSparkles(sx, sy, Math.random() < 0.4 ? GOLD : pal2);
      }, delay3);
    }
  }
  /* Tap: first tap stays snowflake; every tap is a multi-stage shell */
  function rewardTap(x, y) {
    fireShell(nextTapType(), x, y);
  }
  function launch(type) {
    const x = W * (0.12 + Math.random() * 0.76);
    const targetY = H * (0.12 + Math.random() * 0.34);
    rockets.push({
      x, y: H + 10, targetY,
      vy: -(H * 0.0045 + Math.random() * H * 0.0015),
      wobble: Math.random() * Math.PI * 2,
      type: type || TAP_TYPES[Math.floor(Math.random() * TAP_TYPES.length)],
      hue: GOLD[Math.floor(Math.random() * GOLD.length)]
    });
  }
  /* ---------- 피날레: 하늘 가득 겹치는 축포 ---------- */
  function finale() {
    const barrage = ['crossette', 'star', 'spiral', 'saturn', 'shift', 'crossette', 'heart', 'star'];
    for (let i = 0; i < barrage.length; i++) {
      setTimeout(() => launch(barrage[i]), i * 160);
    }
    /* A few sky-wide bright pops — not every shell */
    setTimeout(() => brightFlash(W * 0.5, H * 0.22, '#fff4d0', 150), 980);
    setTimeout(() => fireType('snowflake', W * 0.22, H * 0.24), 1050);
    setTimeout(() => fireType('star', W * 0.5, H * 0.16), 1180);
    setTimeout(() => fireType('snowflake', W * 0.78, H * 0.26), 1320);
    setTimeout(() => fireType('heart', W * 0.34, H * 0.3), 1550);
    setTimeout(() => fireType('spiral', W * 0.66, H * 0.28), 1680);
    setTimeout(() => {
      brightFlash(W * 0.5, H * 0.2, GOLD[0], 130);
      fireType('saturn', W * 0.5, H * 0.2);
    }, 1820);
    setTimeout(() => fireType('shift', W * 0.5, H * 0.22), 1980);
    for (let i = 0; i < 5; i++) {
      setTimeout(() => launch(i % 2 ? 'crossette' : 'saturn'), 2100 + i * 170);
    }
    setTimeout(() => brightFlash(W * 0.42, H * 0.28, '#ffd980', 110), 2450);
    setTimeout(() => fireType('heart', W * 0.5, H * 0.24), 3000);
    setTimeout(() => fireType('snowflake', W * 0.28, H * 0.2), 3200);
    setTimeout(() => fireType('snowflake', W * 0.72, H * 0.18), 3350);
    setTimeout(() => goldenWaterfall(W * 0.5, H * 0.15), 3600);
    setTimeout(() => fireType('crossette', W * 0.4, H * 0.26), 3900);
    setTimeout(() => fireType('crossette', W * 0.6, H * 0.22), 4050);
    setTimeout(() => brightFlash(W * 0.5, H * 0.24, '#fff8e8', 160), 4100);
    setTimeout(showMessage, 4400);
  }
  /* ---------- 자동 발사: 잦은 리듬 + 가끔 일제 사격 ---------- */
  let nextAuto = performance.now() + 2600;
  let autoCount = 0;
  function schedule(now) {
    nextAuto = now + 2500 + Math.random() * 2500;
  }
  function autoLaunch(now) {
    const roll = Math.random();
    if (roll < 0.24) {
      const n = 2 + (Math.random() < 0.5 ? 1 : 0);
      for (let i = 0; i < n; i++) {
        setTimeout(() => launch(), i * (140 + Math.random() * 100));
      }
    } else if (roll < 0.42) {
      launch();
      setTimeout(() => launch(), 80 + Math.random() * 140);
    } else {
      launch();
    }
    schedule(now);
    autoCount++;
    if (autoCount % 3 === 1) setTimeout(showMessage, 1400);
  }
  /* ---------- 터치: 탭 · 꾹 · 드래그(도화선) ---------- */
  const fuses = [];
  function igniteFuse(path) {
    const pts = [path[0]];
    for (let i = 1; i < path.length; i++) {
      const prev = pts[pts.length - 1];
      if (Math.hypot(path[i].x - prev.x, path[i].y - prev.y) >= 10) pts.push(path[i]);
    }
    if (pts.length > 1) fuses.push({ pts, idx: 0 });
  }
  let pressTimer = null;
  let longPressed = false;
  let dragging = false;
  let activePointerId = null;
  let dragPath = [];
  let dragLen = 0;
  const pointerOpts = { passive: false };
  function endDrag(e) {
    clearTimeout(pressTimer);
    if (activePointerId != null) {
      try { fxCanvas.releasePointerCapture?.(activePointerId); } catch (_) {}
      activePointerId = null;
    }
    const wasDragging = dragging;
    dragging = false;
    if (!wasDragging || longPressed) return;
    if (dragLen < 20) {
      rewardTap(e.clientX, Math.min(e.clientY, H * 0.78));
    } else {
      igniteFuse(dragPath.slice());
    }
  }
  window.addEventListener('pointerdown', (e) => {
    if (e.isPrimary === false) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    activePointerId = e.pointerId;
    try { (e.target || fxCanvas).setPointerCapture?.(e.pointerId); } catch (_) {}
    try { fxCanvas.setPointerCapture?.(e.pointerId); } catch (_) {}
    longPressed = false;
    dragging = true;
    dragPath = [{ x: e.clientX, y: e.clientY }];
    dragLen = 0;
    pressTimer = setTimeout(() => {
      if (dragLen < 14) { longPressed = true; finale(); }
    }, 450);
  }, pointerOpts);
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    if (activePointerId != null && e.pointerId !== activePointerId) return;
    e.preventDefault();
    const lastP = dragPath[dragPath.length - 1];
    const d = Math.hypot(e.clientX - lastP.x, e.clientY - lastP.y);
    if (d < 6) return;
    dragLen += d;
    dragPath.push({ x: e.clientX, y: e.clientY });
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 0.3 + Math.random() * 0.7;
      addP(e.clientX, e.clientY, Math.cos(a) * s, Math.sin(a) * s,
        GOLD[Math.floor(Math.random() * GOLD.length)], {
          decay: 0.028 + Math.random() * 0.02,
          r: 0.9 + Math.random(), flicker: true, gravity: 0.015
        });
    }
  }, pointerOpts);
  window.addEventListener('pointerup', (e) => {
    if (activePointerId != null && e.pointerId !== activePointerId) return;
    e.preventDefault();
    endDrag(e);
  }, pointerOpts);
  window.addEventListener('pointercancel', (e) => {
    clearTimeout(pressTimer);
    if (activePointerId != null) {
      try { fxCanvas.releasePointerCapture?.(activePointerId); } catch (_) {}
      activePointerId = null;
    }
    dragging = false;
  }, pointerOpts);
  // iOS Safari: block scroll/pull-to-refresh when a stroke is active
  window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) e.preventDefault();
  }, pointerOpts);
  window.addEventListener('touchmove', (e) => {
    if (dragging) e.preventDefault();
  }, pointerOpts);
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  /* ---------- 렌더 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 16.7, 3);
    last = now;
    const t = now * 0.001;
    /* === 불꽃 캔버스: 잔광 페이드 === */
    fx.globalCompositeOperation = 'destination-out';
    fx.fillStyle = 'rgba(0, 0, 0, 0.16)';
    fx.fillRect(0, 0, W, H);
    fx.globalCompositeOperation = 'lighter';
    if (!reduceMotion) {
      if (now > nextAuto) autoLaunch(now);
      for (let i = flashes.length - 1; i >= 0; i--) {
        const f = flashes[i];
        f.r += (f.maxR - f.r) * (f.grow || 0.34) * dt;
        f.life -= (f.fade || 0.095) * dt;
        if (f.life <= 0) { flashes.splice(i, 1); continue; }
        const g = fx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        const coreA = f.soft ? '66' : (f.color === '#ffffff' ? '99' : '88');
        const midA = f.soft ? '33' : '44';
        g.addColorStop(0, f.color + coreA);
        g.addColorStop(0.4, f.color + midA);
        g.addColorStop(1, 'transparent');
        fx.globalAlpha = f.life * (f.intensity != null ? f.intensity : 0.4);
        fx.fillStyle = g;
        fx.beginPath();
        fx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        fx.fill();
      }
      fx.globalAlpha = 1;
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        const prevY = r.y;
        r.y += r.vy * dt * 4;
        r.x += Math.sin(now * 0.01 + r.wobble) * 0.3 * dt;
        r.vy *= 0.996;
        /* Bright rising trail before the break */
        fx.strokeStyle = r.hue || '#ffe9b8';
        fx.globalAlpha = 0.55;
        fx.lineWidth = 2.2;
        fx.beginPath();
        fx.moveTo(r.x, prevY + 10);
        fx.lineTo(r.x, r.y);
        fx.stroke();
        fx.globalAlpha = 0.9;
        fx.fillStyle = '#fff6d8';
        fx.beginPath();
        fx.arc(r.x, r.y, 2.1, 0, Math.PI * 2);
        fx.fill();
        fx.globalAlpha = 1;
        if (Math.random() < 0.55 && particles.length < MAX_PARTICLES) {
          addP(r.x, r.y + 4, (Math.random() - 0.5) * 0.25, 0.4 + Math.random() * 0.5,
            r.hue || '#ffd980', {
              decay: 0.04, r: 0.9 + Math.random() * 0.6,
              gravity: 0.02, flicker: true
            });
        }
        if (r.y <= r.targetY || r.vy > -0.5) {
          fireShell(r.type, r.x, r.y);
          rockets.splice(i, 1);
        }
      }
      for (let i = fuses.length - 1; i >= 0; i--) {
        const fu = fuses[i];
        let steps = Math.ceil(1.6 * dt);
        while (steps-- > 0 && fu.idx < fu.pts.length) {
          const pt = fu.pts[fu.idx];
          for (let k = 0; k < 4; k++) {
            const a = Math.random() * Math.PI * 2;
            const s = 0.4 + Math.random() * 1;
            addP(pt.x, pt.y, Math.cos(a) * s, Math.sin(a) * s, '#fff3d6', {
              decay: 0.04, r: 1 + Math.random(), flicker: true
            });
          }
          fu.idx++;
        }
        if (fu.idx >= fu.pts.length) {
          const end = fu.pts[fu.pts.length - 1];
          rewardTap(end.x, Math.min(end.y, H * 0.85));
          if (fu.pts.length > 26) {
            const mid = fu.pts[Math.floor(fu.pts.length / 2)];
            setTimeout(() => rewardTap(mid.x, Math.min(mid.y, H * 0.85)), 250);
          }
          fuses.splice(i, 1);
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx = p.vx * p.friction + p.drift * dt;
        p.vy = p.vy * p.friction + p.gravity * dt;
        p.life -= p.decay * dt;
        /* Crossette: delayed secondary pops while still in flight */
        if (p.sub && p.subAt != null && p.life <= p.subAt) {
          crossettePop(p.x, p.y, p.sub);
          p.sub = null;
          p.subAt = null;
        }
        if (p.life <= 0) {
          if (p.sub) miniBurst(p.x, p.y, p.sub);
          particles.splice(i, 1);
          continue;
        }
        let alpha = p.life < 0.35 ? p.life / 0.35 : 1;
        if (p.flicker && Math.random() < 0.35) alpha *= 0.2;
        let col = p.color;
        if (p.color2) {
          if (p.colorMid && p.life < 0.72 && p.life >= 0.42) col = p.colorMid;
          else if (p.life < 0.42) col = p.color2;
        }
        fx.globalAlpha = alpha * 0.95;
        fx.fillStyle = col;
        fx.beginPath();
        fx.arc(p.x, p.y, p.r * (0.55 + p.life * 0.45), 0, Math.PI * 2);
        fx.fill();
      }
      fx.globalAlpha = 1;
    }
    fx.globalCompositeOperation = 'source-over';
    /* === 눈 캔버스: 매 프레임 새로 (또렷한 눈) === */
    sc.clearRect(0, 0, W, H);
    for (const s of stars) {
      const tw = reduceMotion ? 1 : (0.65 + 0.35 * Math.sin(t * s.speed + s.phase));
      sc.globalAlpha = s.base * tw;
      sc.fillStyle = '#eef1fa';
      sc.beginPath();
      sc.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      sc.fill();
    }
    sc.globalAlpha = 1;
    for (const f of flakes) {
      f.y += (f.vy / H) * dt * 1.6;
      f.sway += f.swaySpeed * 0.016 * dt;
      const fxpos = (f.x + Math.sin(f.sway) * f.swayAmp * 0.03) * W;
      const fypos = f.y * H;
      if (f.y > 1.03) Object.assign(f, newFlake(false));
      sc.globalAlpha = f.alpha;
      sc.fillStyle = '#f4f7ff';
      sc.beginPath();
      sc.arc(fxpos, fypos, f.r, 0, Math.PI * 2);
      sc.fill();
    }
    sc.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  /* ---------- 오프닝: 고요한 눈, 그리고 첫 문장 ---------- */
  setTimeout(showMessage, 4200);
  if (reduceMotion) {
    setInterval(showMessage, 11000);
  }
})();
</script>
</body>
</html>
