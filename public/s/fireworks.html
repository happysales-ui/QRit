<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘도 고생한 나를 위한 불꽃놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05070f; }
  body { font-family:'Gowun Batang', serif; -webkit-tap-highlight-color:transparent; }

  #sky {
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 120% 70% at 50% 110%, rgba(38,32,74,.55) 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(20,30,66,.6) 0%, transparent 60%),
      linear-gradient(180deg, #04050c 0%, #070a18 45%, #0b0f24 78%, #101331 100%);
  }

  canvas { position:fixed; inset:0; display:block; }
  #fw   { z-index:3; }
  #snow { z-index:4; pointer-events:none; }

  #city {
    position:fixed; left:0; right:0; bottom:0; height:18vh; min-height:110px;
    z-index:2; pointer-events:none;
  }

  #quote {
    position:fixed; left:50%; top:16%;
    transform:translateX(-50%);
    z-index:6; pointer-events:none;
    width:min(88vw, 640px); text-align:center;
    color:#f4ead8;
    opacity:0; transition:opacity 2.4s ease, filter 2.4s ease;
    filter:blur(6px);
    text-shadow:0 0 22px rgba(255,214,150,.35), 0 0 60px rgba(160,120,255,.18);
  }
  #quote.show { opacity:1; filter:blur(0); }
  #quote .line {
    font-size:clamp(1.15rem, 3.4vw, 1.8rem);
    line-height:1.75; font-weight:700; letter-spacing:.04em;
    word-break:keep-all;
  }
  #quote .sub {
    margin-top:.9em;
    font-size:clamp(.78rem, 2vw, .95rem);
    letter-spacing:.28em; color:rgba(244,234,216,.55); font-weight:400;
  }

  #hint {
    position:fixed; left:50%; bottom:20vh; transform:translateX(-50%);
    z-index:6; pointer-events:none;
    color:rgba(244,234,216,.6);
    font-size:clamp(.8rem,2.4vw,.95rem); letter-spacing:.22em;
    animation:hintPulse 3.2s ease-in-out infinite;
    transition:opacity 1.6s ease;
  }
  @keyframes hintPulse { 0%,100%{opacity:.35} 50%{opacity:.85} }
  #hint.gone { opacity:0 !important; animation:none; }

  @media (prefers-reduced-motion: reduce) {
    #hint { animation:none; opacity:.6; }
  }
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="city"></canvas>
<canvas id="fw"></canvas>
<canvas id="snow"></canvas>

<div id="quote" aria-live="polite">
  <div class="line" id="quoteLine"></div>
  <div class="sub" id="quoteSub"></div>
</div>
<div id="hint">하늘 어디든 손끝을 대어 보세요 · 누를 때마다 다른 폭죽이 핍니다</div>

<script>
(() => {
  'use strict';

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const fwC = document.getElementById('fw');
  const snowC = document.getElementById('snow');
  const cityC = document.getElementById('city');
  const fx = fwC.getContext('2d');
  const sx = snowC.getContext('2d');

  let W = 0, H = 0;

  /* ---------- 도시 실루엣 ---------- */
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function drawCity() {
    const c = cityC, ctx = c.getContext('2d');
    const cw = window.innerWidth, ch = Math.max(window.innerHeight * 0.18, 110);
    c.width = cw * DPR; c.height = ch * DPR;
    c.style.width = cw + 'px'; c.style.height = ch + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, cw, ch);

    const g = ctx.createLinearGradient(0, 0, 0, ch);
    g.addColorStop(0, 'rgba(255,190,120,0)');
    g.addColorStop(1, 'rgba(255,170,90,.07)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);

    const rng = mulberry(20260722);
    let x = -10;
    ctx.fillStyle = '#04040a';
    const buildings = [];
    while (x < cw + 10) {
      const bw = 26 + rng() * 60;
      const bh = ch * (0.35 + rng() * 0.6);
      buildings.push({ x, bw, bh });
      ctx.fillRect(x, ch - bh, bw, bh);
      if (rng() < 0.35) ctx.fillRect(x + bw * 0.3, ch - bh - 8, bw * 0.25, 8);
      x += bw + 2 + rng() * 8;
    }
    for (const b of buildings) {
      const cols = Math.floor(b.bw / 9), rows = Math.floor(b.bh / 12);
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        if (rng() < 0.16) {
          const warm = rng() < 0.8;
          ctx.fillStyle = warm ? 'rgba(255,203,130,' + (0.25 + rng() * 0.5) + ')'
                               : 'rgba(160,200,255,' + (0.2 + rng() * 0.4) + ')';
          ctx.fillRect(b.x + 3 + i * 9, ch - b.bh + 5 + j * 12, 3.5, 5);
        }
      }
    }
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [fwC, snowC]) {
      c.width = W * DPR; c.height = H * DPR;
      c.style.width = W + 'px'; c.style.height = H + 'px';
      c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    drawCity();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- 색상 팔레트 ---------- */
  const PALETTES = [
    ['#ffd873','#ffb347','#fff3c4','#ff9d5c'],            // 황금
    ['#ff5e6c','#ff2e4c','#ffd1d6','#ff9aa8'],            // 홍색
    ['#ffd873','#ff5e6c','#fff3c4','#ff2e4c'],            // 금홍
    ['#7ce8ff','#4cc3ff','#e0f8ff','#9ad9ff'],            // 얼음빛
    ['#c48cff','#9d5cff','#f0deff','#ff8cf0'],            // 보라·분홍
    ['#8cffb0','#4ce88c','#e0ffe8','#c4ffd6'],            // 비취
    ['#ffd873','#c48cff','#7ce8ff','#ff9aa8'],            // 오색
    ['#ff9d5c','#ffdf9e','#ff5e6c','#fff3c4'],            // 노을
  ];
  const GOLD = PALETTES[0];

  const rockets = [];
  const particles = [];
  const flashes = [];
  const MAX_P = reduced ? 900 : 3000;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  function spawnParticle(o) {
    if (particles.length >= MAX_P) particles.shift();
    particles.push(o);
  }

  function launchRocket(tx, ty, type, palette) {
    const sxp = tx + rand(-30, 30);
    rockets.push({
      x: sxp, y: H + 10,
      tx, ty,
      vx: (tx - sxp) / rand(70, 90),
      vy: -rand(H * 0.011, H * 0.0135),
      type, palette,
      life: 0
    });
  }

  /* ---------- 모양 좌표 생성 유틸 ---------- */
  // 파라메트릭 곡선을 방향벡터 배열로
  function heartDirs(n) {
    const dirs = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      dirs.push([hx / 17, hy / 17]);
    }
    return dirs;
  }
  function starDirs(n, points) {
    const dirs = [];
    const outer = 1, inner = 0.42;
    for (let i = 0; i < n; i++) {
      const t = i / n;
      const seg = t * points * 2;
      const idx = Math.floor(seg), frac = seg - idx;
      const a0 = (idx / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      const a1 = ((idx + 1) / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      const r0 = idx % 2 === 0 ? outer : inner;
      const r1 = idx % 2 === 0 ? inner : outer;
      const x = Math.cos(a0) * r0 * (1 - frac) + Math.cos(a1) * r1 * frac;
      const y = Math.sin(a0) * r0 * (1 - frac) + Math.sin(a1) * r1 * frac;
      dirs.push([x, y]);
    }
    return dirs;
  }
  function ringDirs(n, tilt, rot) {
    const dirs = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      let dx = Math.cos(a), dy = Math.sin(a) * tilt;
      dirs.push([
        dx * Math.cos(rot) - dy * Math.sin(rot),
        dx * Math.sin(rot) + dy * Math.cos(rot)
      ]);
    }
    return dirs;
  }
  // 눈결정: 6각 대칭, 중심 줄기 + 곁가지
  // spineN: 줄기 점 개수, branches: [위치(0~1), 길이, 점수] 배열, hex: 육각 테두리, tips: 끝 장식
  function flakeDirs(opts) {
    const pts = [];
    const arms = 6;
    const rot0 = opts.rot || 0;
    for (let ar = 0; ar < arms; ar++) {
      const a = rot0 + (ar / arms) * Math.PI * 2;
      const ux = Math.cos(a), uy = Math.sin(a);
      // 중심 줄기
      for (let i = 0; i < opts.spineN; i++) {
        const t = 0.12 + (i / (opts.spineN - 1)) * 0.88;
        pts.push([ux * t, uy * t]);
      }
      // 곁가지 (±60도)
      for (const [pos, len, bn] of opts.branches) {
        for (const sign of [1, -1]) {
          const ba = a + sign * Math.PI / 3;
          const bx = Math.cos(ba), by = Math.sin(ba);
          for (let i = 1; i <= bn; i++) {
            const bt = (i / bn) * len;
            pts.push([ux * pos + bx * bt, uy * pos + by * bt]);
          }
        }
      }
      // 끝 장식: 팔 끝에 작은 점 무리
      if (opts.tips) {
        for (let i = 0; i < opts.tips; i++) {
          const ta = a + rand(-0.25, 0.25);
          const tr = 1 + rand(0, 0.08);
          pts.push([Math.cos(ta) * tr, Math.sin(ta) * tr]);
        }
      }
    }
    // 육각 테두리: 팔 끝을 잇는 선
    if (opts.hex) {
      const hr = opts.hex;
      for (let ar = 0; ar < arms; ar++) {
        const a0 = rot0 + (ar / arms) * Math.PI * 2;
        const a1 = rot0 + ((ar + 1) / arms) * Math.PI * 2;
        const x0 = Math.cos(a0) * hr, y0 = Math.sin(a0) * hr;
        const x1 = Math.cos(a1) * hr, y1 = Math.sin(a1) * hr;
        const segN = opts.hexN || 7;
        for (let i = 1; i < segN; i++) {
          const f = i / segN;
          pts.push([x0 * (1 - f) + x1 * f, y0 * (1 - f) + y1 * f]);
        }
      }
    }
    // 중심 육각 코어
    if (opts.core) {
      for (let ar = 0; ar < arms; ar++) {
        const a = rot0 + (ar / arms) * Math.PI * 2 + Math.PI / 6;
        pts.push([Math.cos(a) * opts.core, Math.sin(a) * opts.core]);
      }
    }
    return pts;
  }

  // 얼음 팔레트: 흰빛·얼음빛·은보라
  const ICE = [
    ['#ffffff','#dff4ff','#b8e6ff','#eafaff'],
    ['#f4f8ff','#c9e9ff','#9ad9ff','#ffffff'],
    ['#ffffff','#e6e0ff','#c4baff','#f0ecff'],
    ['#eafcff','#aee8f5','#ffffff','#d0f4ff'],
  ];

  function shapeBurst(x, y, dirs, palette, opt = {}) {
    const speed = opt.speed || 5.2;
    for (const [dx, dy] of dirs) {
      const jitter = opt.jitter || 0.05;
      spawnParticle({
        x, y,
        vx: dx * speed * rand(1 - jitter, 1 + jitter),
        vy: dy * speed * rand(1 - jitter, 1 + jitter),
        g: opt.g ?? 0.02, drag: opt.drag ?? 0.988,
        life: rand(opt.lifeMin || 80, opt.lifeMax || 120), age: 0,
        size: rand(1.5, 2.4), color: opt.solid ? palette[0] : pick(palette),
        trail: true, twinkle: opt.twinkle || false,
        color2: opt.color2 || null,
        curl: opt.curlAll || 0
      });
    }
  }

  // 눈결정 중심의 얼음빛 심장: 은은한 광채 + 흩날리는 서리 가루
  function iceHeart(x, y, N) {
    flashes.push({ x, y, r: 0, max: rand(90, 140), a: 0.35, cool: true });
    const n = 30 * N | 0;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 1.2;
      spawnParticle({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 0.1,
        g: 0.004, drag: 0.988, life: rand(70, 120), age: 0,
        size: rand(0.7, 1.4), color: pick(['#ffffff','#dff4ff','#eafaff']),
        trail: false, twinkle: true
      });
    }
  }

  /* ---------- 폭발: 13종 ---------- */
  function explode(x, y, type, palette) {
    flashes.push({ x, y, r: 0, max: rand(120, 200), a: 0.5 });
    const [c1] = palette;
    const N = reduced ? 0.5 : 1;

    switch (type) {
      case 'chrys': { // ① 국화: 꼬리 긴 구형 대폭발
        const n = 190 * N | 0;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + rand(-0.02, 0.02);
          const sp = rand(2.2, 7.4) * (0.75 + Math.random() * 0.5);
          spawnParticle({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            g: 0.028, drag: 0.985, life: rand(70, 120), age: 0,
            size: rand(1.4, 2.6), color: pick(palette), trail: true,
            twinkle: Math.random() < 0.4
          });
        }
        break;
      }
      case 'willow': { // ② 수양버들: 금빛으로 길게 늘어짐
        const n = 140 * N | 0;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          const sp = rand(1.6, 4.6);
          spawnParticle({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            g: 0.02, drag: 0.992, life: rand(150, 230), age: 0,
            size: rand(1.2, 2.2), color: pick(GOLD), trail: true,
            twinkle: false, willow: true
          });
        }
        break;
      }
      case 'heart': { // ③ 하트
        shapeBurst(x, y, heartDirs(110 * N | 0), pick([PALETTES[1], PALETTES[4]]), 
          { speed: rand(4.6, 5.6), g: 0.016, drag: 0.99, lifeMin: 90, lifeMax: 130 });
        // 중심 반짝임
        for (let i = 0; i < 24 * N; i++) {
          const a = Math.random() * Math.PI * 2, sp = Math.random() * 1.4;
          spawnParticle({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
            g: 0.014, drag: 0.985, life: rand(50, 80), age: 0,
            size: rand(0.9, 1.6), color: '#fff0f4', trail: false, twinkle: true });
        }
        break;
      }
      case 'star5': { // ④ 오각별
        shapeBurst(x, y, starDirs(120 * N | 0, 5), palette,
          { speed: rand(4.8, 5.8), g: 0.017, drag: 0.99, solid: true, lifeMin: 85, lifeMax: 125 });
        break;
      }
      case 'spiral': { // ⑤ 나선 은하: 4개의 팔이 휘감김
        const arms = 4, per = 34 * N | 0;
        const rot0 = rand(0, Math.PI * 2);
        for (let ar = 0; ar < arms; ar++) {
          for (let i = 0; i < per; i++) {
            const t = i / per;
            const a = rot0 + (ar / arms) * Math.PI * 2 + t * 2.4;
            const sp = 1.6 + t * 5.4;
            spawnParticle({
              x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
              g: 0.02, drag: 0.987, life: rand(80, 115), age: 0,
              size: rand(1.3, 2.2), color: pick(palette), trail: true,
              twinkle: t > 0.7, curl: rand(0.015, 0.03) * (Math.random() < 0.5 ? 1 : 1)
            });
          }
        }
        break;
      }
      case 'saturn': { // ⑥ 토성: 코어 + 기울어진 링
        const core = 80 * N | 0;
        for (let i = 0; i < core; i++) {
          const a = (i / core) * Math.PI * 2;
          const sp = rand(1.2, 2.6);
          spawnParticle({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            g: 0.02, drag: 0.986, life: rand(70, 100), age: 0,
            size: rand(1.4, 2.2), color: pick(palette), trail: true, twinkle: false
          });
        }
        shapeBurst(x, y, ringDirs(90 * N | 0, rand(0.28, 0.42), rand(-0.5, 0.5)), GOLD,
          { speed: rand(5.4, 6.2), g: 0.02, drag: 0.987, solid: true, lifeMin: 80, lifeMax: 110 });
        break;
      }
      case 'butterfly': { // ⑦ 나비: 두 링이 교차
        const rot = rand(0, Math.PI);
        const p2 = pick(PALETTES);
        shapeBurst(x, y, ringDirs(70 * N | 0, 0.5, rot + 0.6), palette,
          { speed: 5.2, g: 0.02, drag: 0.988, solid: true });
        shapeBurst(x, y, ringDirs(70 * N | 0, 0.5, rot - 0.6), p2,
          { speed: 5.2, g: 0.02, drag: 0.988, solid: true });
        break;
      }
      case 'palm': { // ⑧ 야자수: 굵은 금빛 줄기가 뻗어 늘어짐
        const trunks = 10 * N | 0;
        for (let t = 0; t < Math.max(trunks, 6); t++) {
          const a = -Math.PI / 2 + rand(-1.4, 1.4);
          const sp = rand(4.5, 6.5);
          const seg = 14;
          for (let i = 0; i < seg; i++) {
            spawnParticle({
              x, y,
              vx: Math.cos(a) * sp * (1 - i * 0.03) + rand(-0.15, 0.15),
              vy: Math.sin(a) * sp * (1 - i * 0.03) + rand(-0.15, 0.15),
              g: 0.032, drag: 0.99, life: rand(120, 180), age: 0,
              size: rand(2, 3.2), color: pick(GOLD), trail: true,
              willow: true, twinkle: i > 9
            });
          }
        }
        break;
      }
      case 'shift': { // ⑨ 변색 피오니: 날아가다 색이 바뀜
        const p2 = pick(PALETTES.filter(p => p !== palette));
        const n = 150 * N | 0;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + rand(-0.03, 0.03);
          const sp = rand(3.6, 6.6);
          spawnParticle({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            g: 0.025, drag: 0.986, life: rand(85, 125), age: 0,
            size: rand(1.5, 2.5), color: c1, color2: pick(p2),
            trail: true, twinkle: false
          });
        }
        break;
      }
      case 'wave': { // ⑩ 파문: 세 겹의 물결이 시차를 두고 퍼짐
        const cols = [palette[0], palette[1], '#fff3c4'];
        for (let w = 0; w < 3; w++) {
          setTimeout(() => {
            const n = 80 * N | 0;
            for (let i = 0; i < n; i++) {
              const a = (i / n) * Math.PI * 2;
              const sp = 5.6 - w * 0.4;
              spawnParticle({
                x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                g: 0.02, drag: 0.985, life: rand(70, 95), age: 0,
                size: rand(1.5, 2.3), color: cols[w], trail: true, twinkle: w === 2
              });
            }
          }, w * 260);
        }
        break;
      }
      case 'crossette': { // ⑪ 크로세트: 별이 4갈래로 재분열
        const n = 42 * N | 0;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + rand(-0.05, 0.05);
          const sp = rand(3.4, 5.6);
          spawnParticle({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            g: 0.026, drag: 0.986, life: rand(40, 60), age: 0,
            size: rand(1.8, 2.6), color: pick(palette), trail: true,
            split: true, palette
          });
        }
        break;
      }
      case 'crackle': { // ⑫ 크래클: 은반짝이 점멸 구름
        const n = 240 * N | 0;
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = Math.pow(Math.random(), 0.5) * 6.2;
          spawnParticle({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            g: 0.03, drag: 0.982, life: rand(60, 130), age: 0,
            size: rand(0.9, 1.8), color: Math.random() < 0.7 ? '#fff6dc' : pick(palette),
            trail: false, twinkle: true
          });
        }
        break;
      }
      case 'flakeDendrite': { // ❄① 가지 눈결정: 곁가지가 풍성한 고전 결정
        const pal = pick(ICE);
        const dirs = flakeDirs({
          rot: rand(0, Math.PI / 3), spineN: 14 * N + 6 | 0,
          branches: [[0.42, 0.3, 5], [0.62, 0.26, 4], [0.8, 0.2, 3]],
          tips: 3, core: 0.1
        });
        shapeBurst(x, y, dirs, pal, {
          speed: rand(4.2, 5), jitter: 0.02, g: 0.007, drag: 0.991,
          lifeMin: 130, lifeMax: 180, twinkle: false, curlAll: rand(-0.006, 0.006)
        });
        iceHeart(x, y, N);
        break;
      }
      case 'flakeStellar': { // ❄② 성판 눈결정: 육각 테두리가 팔 끝을 잇는 별판형
        const pal = pick(ICE);
        const dirs = flakeDirs({
          rot: rand(0, Math.PI / 3), spineN: 12 * N + 5 | 0,
          branches: [[0.55, 0.22, 4]],
          hex: 0.62, hexN: 8, tips: 4, core: 0.12
        });
        shapeBurst(x, y, dirs, pal, {
          speed: rand(4.4, 5.2), jitter: 0.015, g: 0.007, drag: 0.991,
          lifeMin: 130, lifeMax: 175, curlAll: rand(-0.005, 0.005)
        });
        iceHeart(x, y, N);
        break;
      }
      case 'flakeFern': { // ❄③ 고사리 눈결정: 깃털처럼 촘촘한 곁가지, 가장 화려함
        const pal = pick(ICE);
        const dirs = flakeDirs({
          rot: rand(0, Math.PI / 3), spineN: 15 * N + 6 | 0,
          branches: [[0.3, 0.22, 4], [0.46, 0.28, 5], [0.62, 0.24, 4], [0.78, 0.18, 3], [0.9, 0.12, 2]],
          tips: 2
        });
        shapeBurst(x, y, dirs, pal, {
          speed: rand(4.4, 5.4), jitter: 0.02, g: 0.006, drag: 0.992,
          lifeMin: 145, lifeMax: 200, curlAll: rand(-0.007, 0.007)
        });
        iceHeart(x, y, N);
        break;
      }
      case 'flakeLace': { // ❄④ 레이스 눈결정: 안팎 이중 육각과 12갈래 잔가시
        const pal = pick(ICE);
        // 바깥 결정
        const outer = flakeDirs({
          rot: 0, spineN: 10 * N + 5 | 0,
          branches: [[0.68, 0.2, 3]], hex: 0.8, hexN: 9, tips: 3
        });
        // 안쪽 결정: 30도 어긋난 작은 결정
        const inner = flakeDirs({
          rot: Math.PI / 6, spineN: 6 * N + 4 | 0,
          branches: [], hex: 0.42, hexN: 6, core: 0.1
        }).map(([px, py]) => [px * 0.5, py * 0.5]);
        shapeBurst(x, y, outer, pal, {
          speed: rand(4.6, 5.4), jitter: 0.015, g: 0.007, drag: 0.991,
          lifeMin: 130, lifeMax: 175, curlAll: 0.006
        });
        shapeBurst(x, y, inner, ['#ffffff','#f0faff','#dff4ff','#ffffff'], {
          speed: rand(4.6, 5.4), jitter: 0.015, g: 0.007, drag: 0.991,
          lifeMin: 130, lifeMax: 175, curlAll: -0.008, twinkle: true
        });
        break;
      }
      case 'peony2': { // ⑬ 이중 피오니: 안팎 두 색의 겹폭발
        const inner = pick(PALETTES);
        for (const [pal, spMin, spMax, cnt] of [[palette, 4.4, 7, 130 * N | 0], [inner, 1.6, 3, 90 * N | 0]]) {
          for (let i = 0; i < cnt; i++) {
            const a = (i / cnt) * Math.PI * 2 + rand(-0.03, 0.03);
            const sp = rand(spMin, spMax);
            spawnParticle({
              x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
              g: 0.027, drag: 0.985, life: rand(70, 115), age: 0,
              size: rand(1.4, 2.5), color: pick(pal), trail: true,
              twinkle: Math.random() < 0.3
            });
          }
        }
        break;
      }
    }
  }

  function splitStar(p) {
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + rand(0, Math.PI / 2);
      const sp = rand(1.4, 2.6);
      spawnParticle({
        x: p.x, y: p.y,
        vx: Math.cos(a) * sp + p.vx * 0.3,
        vy: Math.sin(a) * sp + p.vy * 0.3,
        g: 0.028, drag: 0.985, life: rand(35, 60), age: 0,
        size: rand(1, 1.8), color: pick(p.palette), trail: true, twinkle: true
      });
    }
  }

  const TYPES = ['chrys','willow','heart','star5','spiral','saturn','butterfly','palm','shift','wave','crossette','crackle','peony2','flakeDendrite','flakeStellar','flakeFern','flakeLace'];

  /* ---------- 터치 순환 큐: 누를 때마다 반드시 새로운 모양 ---------- */
  let tapQueue = [];
  function refillQueue(lastType) {
    tapQueue = TYPES.slice();
    for (let i = tapQueue.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [tapQueue[i], tapQueue[j]] = [tapQueue[j], tapQueue[i]];
    }
    // 직전 것과 연달아 같지 않도록
    if (tapQueue[tapQueue.length - 1] === lastType) {
      [tapQueue[0], tapQueue[tapQueue.length - 1]] = [tapQueue[tapQueue.length - 1], tapQueue[0]];
    }
  }
  let lastTapType = null;
  function nextTapType() {
    if (tapQueue.length === 0) refillQueue(lastTapType);
    lastTapType = tapQueue.pop();
    return lastTapType;
  }

  /* ---------- 자동 발사 + 피날레 ---------- */
  let nextLaunch = 800;
  let nextFinale = 14000;
  function autoLaunch(dt) {
    nextLaunch -= dt;
    nextFinale -= dt;
    if (nextLaunch <= 0) {
      launchRocket(rand(W * 0.15, W * 0.85), rand(H * 0.14, H * 0.42), pick(TYPES), pick(PALETTES));
      nextLaunch = reduced ? rand(2600, 4200) : rand(1100, 2300);
    }
    if (nextFinale <= 0 && !reduced) {
      const count = 4 + (Math.random() * 3 | 0);
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          launchRocket(rand(W * 0.1, W * 0.9), rand(H * 0.12, H * 0.4), pick(TYPES), pick(PALETTES));
        }, i * rand(120, 300));
      }
      nextFinale = rand(16000, 24000);
    }
  }

  /* ---------- 터치/클릭 ---------- */
  const hint = document.getElementById('hint');
  let touched = false;
  fwC.addEventListener('pointerdown', e => {
    if (!touched) { touched = true; hint.classList.add('gone'); }
    explode(e.clientX, e.clientY, nextTapType(), pick(PALETTES));
  });

  /* ---------- 눈 ---------- */
  const flakes = [];
  function initSnow() {
    flakes.length = 0;
    const n = reduced ? 45 : Math.min(140, (window.innerWidth * window.innerHeight) / 12000 | 0);
    for (let i = 0; i < n; i++) {
      flakes.push({
        x: Math.random() * W, y: Math.random() * H,
        r: rand(0.8, 2.6), sp: rand(0.18, 0.65),
        sway: rand(0.4, 1.4), ph: Math.random() * Math.PI * 2,
        a: rand(0.25, 0.85)
      });
    }
  }
  initSnow();
  window.addEventListener('resize', initSnow);

  function drawSnow(t) {
    sx.clearRect(0, 0, W, H);
    sx.fillStyle = '#eaf2ff';
    for (const f of flakes) {
      f.y += f.sp;
      f.x += Math.sin(t / 1800 + f.ph) * f.sway * 0.3;
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      if (f.x > W + 4) f.x = -4; else if (f.x < -4) f.x = W + 4;
      sx.globalAlpha = f.a;
      sx.beginPath();
      sx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      sx.fill();
    }
    sx.globalAlpha = 1;
  }

  /* ---------- 별 ---------- */
  const stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({ x: Math.random(), y: Math.random() * 0.7, r: rand(0.4, 1.3), tw: Math.random() * Math.PI * 2 });
  }

  /* ---------- 메인 루프 ---------- */
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(t - last, 50);
    last = t;

    autoLaunch(dt);

    fx.globalCompositeOperation = 'destination-out';
    fx.fillStyle = 'rgba(4,5,12,0.22)';
    fx.fillRect(0, 0, W, H);

    fx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const tw = 0.35 + 0.35 * Math.sin(t / 900 + s.tw);
      fx.globalAlpha = tw;
      fx.fillStyle = '#dfe8ff';
      fx.beginPath();
      fx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      fx.fill();
    }
    fx.globalAlpha = 1;

    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.r += (f.max - f.r) * 0.25;
      f.a *= 0.82;
      if (f.a < 0.01) { flashes.splice(i, 1); continue; }
      const g = fx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      const fc = f.cool ? '210,238,255' : '255,250,235';
      g.addColorStop(0, 'rgba(' + fc + ',' + f.a + ')');
      g.addColorStop(1, 'rgba(' + fc + ',0)');
      fx.fillStyle = g;
      fx.beginPath(); fx.arc(f.x, f.y, f.r, 0, Math.PI * 2); fx.fill();
    }

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx * (dt / 16.7);
      r.y += r.vy * (dt / 16.7);
      r.vy += 0.012 * (dt / 16.7);

      fx.fillStyle = '#ffdf9e';
      fx.globalAlpha = 0.9;
      fx.beginPath(); fx.arc(r.x, r.y, 1.8, 0, Math.PI * 2); fx.fill();
      fx.globalAlpha = 0.35;
      fx.beginPath(); fx.arc(r.x + rand(-1.2,1.2), r.y + rand(2,9), 1, 0, Math.PI * 2); fx.fill();
      fx.globalAlpha = 1;
      if (Math.random() < 0.5) {
        spawnParticle({
          x: r.x + rand(-1, 1), y: r.y + rand(1, 4),
          vx: rand(-0.3, 0.3), vy: rand(0.4, 1),
          g: 0.005, drag: 0.98, life: rand(18, 32), age: 0,
          size: rand(0.6, 1.1), color: '#ffcf8a', trail: false, twinkle: false
        });
      }

      if (r.y <= r.ty || r.vy > -1.2) {
        explode(r.x, r.y, r.type, r.palette);
        rockets.splice(i, 1);
      }
    }

    const k = dt / 16.7;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += k;
      if (p.age >= p.life) {
        if (p.split) splitStar(p);
        particles.splice(i, 1);
        continue;
      }
      // 나선용 소용돌이
      if (p.curl) {
        const cvx = p.vx, cvy = p.vy;
        const ca = p.curl * k;
        p.vx = cvx * Math.cos(ca) - cvy * Math.sin(ca);
        p.vy = cvx * Math.sin(ca) + cvy * Math.cos(ca);
      }
      p.vx *= Math.pow(p.drag, k);
      p.vy = p.vy * Math.pow(p.drag, k) + p.g * k;
      p.x += p.vx * k;
      p.y += p.vy * k;

      const lifeRatio = 1 - p.age / p.life;
      let alpha = lifeRatio;
      if (p.twinkle) alpha *= (Math.random() < 0.25 ? 1 : 0.35 + 0.5 * Math.random());
      if (p.willow) alpha = Math.min(1, lifeRatio * 1.4);

      // 변색
      const col = (p.color2 && p.age > p.life * 0.45) ? p.color2 : p.color;

      fx.globalAlpha = Math.max(alpha, 0);
      fx.fillStyle = col;

      if (p.trail) {
        const tl = p.willow ? 6 : 3.4;
        fx.strokeStyle = col;
        fx.lineWidth = p.size;
        fx.lineCap = 'round';
        fx.beginPath();
        fx.moveTo(p.x - p.vx * tl, p.y - p.vy * tl);
        fx.lineTo(p.x, p.y);
        fx.stroke();
      } else {
        fx.beginPath();
        fx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fx.fill();
      }
    }
    fx.globalAlpha = 1;
    fx.globalCompositeOperation = 'source-over';

    drawSnow(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 힐링 글귀 ---------- */
  const QUOTES = [
    ['오늘 하루, 버텨낸 것만으로도\n당신은 충분히 잘했습니다.', '수고했어요, 정말로'],
    ['화가 났던 일은 저 폭죽처럼\n터뜨리고 흩어 보내세요.', '내일의 나에게는 가볍게'],
    ['남들이 몰라줘도 괜찮아요.\n오늘의 최선은 내가 알고 있으니까.', '나는 나의 증인'],
    ['퇴근길의 이 하늘은\n오늘을 견딘 사람에게만 보입니다.', '지금, 당신의 하늘'],
    ['느리게 가도 괜찮습니다.\n눈송이도 서두르지 않고 내려앉아요.', '천천히, 그러나 분명히'],
    ['오늘의 분노는 여기 두고 가세요.\n집에는 편안함만 가져가기로 해요.', '마음의 짐 내려놓기'],
    ['완벽하지 않아도\n오늘의 당신은 이미 빛나고 있어요.', '저 불꽃처럼'],
    ['잘 참았고, 잘 견뎠고,\n잘 살아낸 하루였습니다.', '토닥토닥'],
    ['내일 걱정은 내일의 나에게 맡기고\n지금은 이 하늘만 바라봐요.', '오늘은 여기까지'],
    ['당신이 무너지지 않고 걸어온 길이\n누군가에겐 기적입니다.', '스스로를 안아주세요'],
    ['쉬어가는 것도 성실함의 일부입니다.\n오늘 밤은 마음 놓고 쉬세요.', '충전 중'],
    ['이 폭죽은 전부\n오늘도 고생한 당신을 위한 것입니다.', '축하해요, 하루의 완주를'],
  ];
  const qEl = document.getElementById('quote');
  const qLine = document.getElementById('quoteLine');
  const qSub = document.getElementById('quoteSub');
  let qi = Math.random() * QUOTES.length | 0;

  function showQuote() {
    const [line, sub] = QUOTES[qi % QUOTES.length];
    qi++;
    qLine.innerHTML = line.split('\n').join('<br>');
    qSub.textContent = sub;
    qEl.classList.add('show');
    setTimeout(() => qEl.classList.remove('show'), 7000);
    setTimeout(showQuote, 11000);
  }
  setTimeout(showQuote, 2500);

  setTimeout(() => {
    launchRocket(W * 0.5, H * 0.25, 'peony2', PALETTES[2]);
  }, 600);
})();
</script>
</body>
