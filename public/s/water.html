<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>맑은 물, 고요한 파문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#2c3036; }
  body { font-family:'Gowun Batang', serif; -webkit-tap-highlight-color:transparent; touch-action:none; }

  canvas { position:fixed; inset:0; display:block; }
  #bg      { z-index:1; }   /* 돌 (원본 해상도, 선명) */
  #water   { z-index:2; }   /* 파문 명암 (투명 막) */
  #light   { z-index:3; pointer-events:none; mix-blend-mode:overlay; }  /* 흘러다니는 햇살 */
  #overlay { z-index:4; pointer-events:none; }

  #quote {
    position:fixed; left:50%; top:13%;
    transform:translateX(-50%);
    z-index:6; pointer-events:none;
    width:min(88vw, 640px); text-align:center;
    color:#eef0ea;
    opacity:0; transition:opacity 2.6s ease, filter 2.6s ease;
    filter:blur(6px);
    text-shadow:0 1px 14px rgba(20,24,30,.9), 0 0 32px rgba(180,195,210,.25);
  }
  #quote.show { opacity:1; filter:blur(0); }
  #quote .line {
    font-size:clamp(1.1rem, 3.3vw, 1.7rem);
    line-height:1.8; font-weight:700; letter-spacing:.04em;
    word-break:keep-all;
  }
  #quote .sub {
    margin-top:.9em;
    font-size:clamp(.76rem, 2vw, .92rem);
    letter-spacing:.28em; color:rgba(238,240,234,.55); font-weight:400;
  }

  #hint {
    position:fixed; left:50%; bottom:9vh; transform:translateX(-50%);
    z-index:6; pointer-events:none;
    color:rgba(238,240,234,.65);
    font-size:clamp(.8rem,2.4vw,.95rem); letter-spacing:.2em;
    animation:hintPulse 3.4s ease-in-out infinite;
    transition:opacity 1.6s ease;
    text-shadow:0 1px 8px rgba(20,24,30,.85);
  }
  @keyframes hintPulse { 0%,100%{opacity:.35} 50%{opacity:.85} }
  #hint.gone { opacity:0 !important; animation:none; }

  @media (prefers-reduced-motion: reduce) { #hint { animation:none; opacity:.6; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="water"></canvas>
<canvas id="light"></canvas>
<canvas id="overlay"></canvas>

<div id="quote" aria-live="polite">
  <div class="line" id="quoteLine"></div>
  <div class="sub" id="quoteSub"></div>
</div>
<div id="hint">수면 어디든, 손끝으로 물장구쳐 보세요</div>

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const bgC    = document.getElementById('bg');
  const waterC = document.getElementById('water');
  const lightC = document.getElementById('light');
  const overC  = document.getElementById('overlay');
  const octx = overC.getContext('2d');
  const lctx = lightC.getContext('2d');

  let W = 0, H = 0;
  let gw = 0, gh = 0, cell = 4;
  let cur, prev;
  let img, imgData, simC, simCtx;

  const rand = (a,b) => a + Math.random() * (b - a);

  /* ================================================================
     배경: 얕은 물속 몽돌 사진 (이음새 완화 타일)
     사진에 코스틱/팔레트가 들어 있으므로 필름·비네트만 얹음
  ================================================================ */
  const stoneImg = new Image();
  let stoneReady = false;
  stoneImg.onload = () => { stoneReady = true; drawStones(); };
  stoneImg.src = STONE_IMG_DATA;

  function drawStones() {
    const g = bgC.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    bgC.width = W * dpr; bgC.height = H * dpr;
    bgC.style.width = W + 'px'; bgC.style.height = H + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    g.fillStyle = '#2c3036';
    g.fillRect(0, 0, W, H);
    if (!stoneReady) return;

    // 사진 타일을 화면에 반복해서 깔기 (돌 크기가 적당하도록 배율 조정)
    const scale = Math.max(Math.min(W, H) / 1500, 0.55);
    const tw = Math.round(stoneImg.width * scale), th = Math.round(stoneImg.height * scale);
    for (let ty = 0; ty < H; ty += th) {
      for (let tx = 0; tx < W; tx += tw) {
        // 1px 겹침으로 소수점 틈(머리카락 선) 방지
        g.drawImage(stoneImg, tx, ty, tw + 1, th + 1);
      }
    }

    // 물에 잠긴 색감: 옅은 아쿠아 필름만 (사진은 이미 코스틱/팔레트 포함)
    g.fillStyle = 'rgba(120,168,178,0.08)';
    g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(18,24,32,0.06)';
    g.fillRect(0, 0, W, H);

    // 가장자리 비네트: 시선이 가운데 수면으로 모이게
    const vg = g.createRadialGradient(W*0.5, H*0.45, Math.min(W,H)*0.2, W*0.5, H*0.5, Math.max(W,H)*0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(10,14,20,0.22)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);
  }

  /* ---------- 리사이즈 ---------- */
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cell = W > 1400 ? 5 : W > 700 ? 4 : 3;
    gw = Math.ceil(W / cell);
    gh = Math.ceil(H / cell);

    waterC.width = W; waterC.height = H;
    lightC.width = W; lightC.height = H;
    overC.width = W; overC.height = H;

    cur = new Float32Array(gw * gh);
    prev = new Float32Array(gw * gh);

    simC = document.createElement('canvas');
    simC.width = gw; simC.height = gh;
    simCtx = simC.getContext('2d');
    img = simCtx.createImageData(gw, gh);
    imgData = img.data;

    drawStones();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- 물결 일으키기 ---------- */
  function disturb(px, py, radius, strength) {
    const cx = px / cell | 0, cy = py / cell | 0;
    const r = radius;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const d2 = dx*dx + dy*dy;
        if (d2 > r*r) continue;
        const x = cx + dx, y = cy + dy;
        if (x < 1 || x >= gw-1 || y < 1 || y >= gh-1) continue;
        const fall = 1 - Math.sqrt(d2) / (r + 0.001);
        cur[y*gw + x] += strength * fall;
      }
    }
  }

  const DAMP = 0.982;   // 파문이 조금 더 멀리 번지며 콩알처럼 읽히게
  function stepWater() {
    for (let y = 1; y < gh-1; y++) {
      const row = y*gw;
      for (let x = 1; x < gw-1; x++) {
        const i = row + x;
        let v = (cur[i-1] + cur[i+1] + cur[i-gw] + cur[i+gw]) * 0.5 - prev[i];
        prev[i] = v * DAMP;
      }
    }
    const t = prev; prev = cur; cur = t;
  }

  /* ---------- 파문 렌더링: 돌 위에 얹히는 투명한 명암 막 ---------- */
  function renderWater() {
    const lx = -0.7, ly = -0.7;
    for (let y = 1; y < gh-1; y++) {
      const row = y*gw;
      for (let x = 1; x < gw-1; x++) {
        const i = row + x;
        const gx = cur[i+1] - cur[i-1];
        const gy = cur[i+gw] - cur[i-gw];
        const sh = (gx*lx + gy*ly);

        const o = i * 4;
        if (sh > 0) {           // 물마루: 더 또렷한 흰 빛 (콩알 파문)
          imgData[o] = 236; imgData[o+1] = 242; imgData[o+2] = 246;
          let a = sh * 9.5; if (a > 130) a = 130;
          imgData[o+3] = a;
        } else {                // 골: 더 깊은 그늘
          imgData[o] = 10; imgData[o+1] = 16; imgData[o+2] = 24;
          let a = -sh * 8.0; if (a > 115) a = 115;
          imgData[o+3] = a;
        }
      }
    }
    simCtx.putImageData(img, 0, 0);
    const w = waterC.getContext('2d');
    w.clearRect(0, 0, W, H);
    w.imageSmoothingEnabled = true;
    w.drawImage(simC, 0, 0, gw, gh, 0, 0, W, H);
  }

  /* ---------- 비 ---------- */
  const drops = [];
  const splashes = [];
  let nextDrop = 900;

  function updateRain(dt) {
    nextDrop -= dt;
    if (nextDrop <= 0) {
      drops.push({
        x: rand(W*0.05, W*0.95), y: rand(H*0.08, H*0.92),
        t: 0, dur: rand(420, 560)
      });
      nextDrop = reduced ? rand(3200, 5200) : rand(1300, 2600);
    }
    for (let i = drops.length-1; i >= 0; i--) {
      const d = drops[i];
      d.t += dt;
      if (d.t >= d.dur) {
        disturb(d.x, d.y, 2, -145);
        lastSplash = { x: d.x, y: d.y, t: performance.now() };
        const n = 3 + (Math.random()*2|0);
        for (let j = 0; j < n; j++) {
          const a = (j/n) * Math.PI*2 + rand(-0.2,0.2);
          const sp = rand(0.2, 0.5);
          splashes.push({
            x: d.x, y: d.y,
            vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - rand(0.25, 0.6),
            g: 0.05, life: rand(200, 320), age: 0, r: rand(0.3, 0.7)
          });
        }
        drops.splice(i, 1);
      }
    }
    for (let i = splashes.length-1; i >= 0; i--) {
      const s = splashes[i];
      s.age += dt;
      if (s.age >= s.life) { splashes.splice(i, 1); continue; }
      const k = dt/16.7;
      s.vy += s.g*k;
      s.x += s.vx*k; s.y += s.vy*k;
    }
  }

  function drawRain() {
    for (const d of drops) {
      const p = d.t / d.dur;
      const size = 0.4 + p*1.4;
      const dy = (1-p) * H*0.12;
      octx.globalAlpha = 0.1 + p*0.16;
      octx.fillStyle = '#eef4f6';
      octx.beginPath();
      octx.ellipse(d.x, d.y - dy, size*0.5, size*1.3, 0, 0, Math.PI*2);
      octx.fill();
      octx.globalAlpha = 0.06 * p;
      octx.fillStyle = '#12161c';
      octx.beginPath();
      octx.ellipse(d.x, d.y, size*1.4, size*0.8, 0, 0, Math.PI*2);
      octx.fill();
    }
    for (const s of splashes) {
      const a = 1 - s.age/s.life;
      octx.globalAlpha = a * 0.3;
      octx.fillStyle = '#f0f6f8';
      octx.beginPath();
      octx.arc(s.x, s.y, s.r * a + 0.3, 0, Math.PI*2);
      octx.fill();
    }
    octx.globalAlpha = 1;
  }

  /* ---------- 수면의 낙엽: 물결 따라 흔들리고, 가끔 한 장씩 떨어짐 ---------- */
  function sampleGrad(px, py) {
    const cx = Math.min(Math.max(px/cell|0, 1), gw-2);
    const cy = Math.min(Math.max(py/cell|0, 1), gh-2);
    const i = cy*gw + cx;
    return [cur[i+1]-cur[i-1], cur[i+gw]-cur[i-gw], cur[i]];
  }

  const LEAF_COLORS = [
    ['#5f8049','#79975c','#3f5c33'],   // 초록잎: [몸통, 밝은결, 그늘]
    ['#75824c','#8f9c62','#565f36'],   // 올리브잎
    ['#8a6b42','#a3855a','#63492c'],   // 갈색 낙엽
    ['#697a3f','#87975a','#4a5830'],   // 짙은 풀빛
    ['#9c7a3e','#b89454','#6f5228'],   // 노랗게 물든 잎
  ];
  const leaves = [];
  function makeLeaf(px, py, falling) {
    return {
      x: px, y: py,
      size: rand(30, 52) * Math.min(W, H) / 900 + 16,
      rot: rand(0, Math.PI*2),
      spin: rand(-0.00012, 0.00012),   // 거의 멈춘 듯 아주 천천히
      vx: rand(-0.015, 0.015), vy: rand(-0.015, 0.015),
      colors: LEAF_COLORS[(Math.random()*LEAF_COLORS.length)|0],
      bend: rand(0.25, 0.45),          // 잎의 통통한 정도
      // 낙하 상태
      falling: !!falling,
      fallT: 0, fallDur: rand(2200, 3200),
      swayPh: rand(0, Math.PI*2),
      landX: px, landY: py
    };
  }
  for (let i = 0; i < 2; i++) {
    leaves.push(makeLeaf(rand(W*0.1, W*0.9), rand(H*0.12, H*0.88), false));
  }
  let nextLeafFall = 12000;

  function updateLeaves(dt) {
    nextLeafFall -= dt;
    if (nextLeafFall <= 0 && leaves.length < 4 && !reduced) {
      leaves.push(makeLeaf(rand(W*0.15, W*0.85), rand(H*0.15, H*0.85), true));
      nextLeafFall = rand(28000, 48000);
    }
    const k = dt/16.7;
    for (const lf of leaves) {
      if (lf.falling) {
        lf.fallT += dt;
        if (lf.fallT >= lf.fallDur) {
          lf.falling = false;
          disturb(lf.landX, lf.landY, 2, -120);  // 착수의 또렷한 파문
        }
        continue;
      }
      const [gx, gy] = sampleGrad(lf.x, lf.y);
      lf.vx += gx * -0.003 * k;
      lf.vy += gy * -0.003 * k;
      lf.vx *= 0.996; lf.vy *= 0.996;
      lf.x += lf.vx * k;
      lf.y += lf.vy * k;
      lf.rot += lf.spin * dt;
      if (lf.x < -50) lf.x = W+50; else if (lf.x > W+50) lf.x = -50;
      if (lf.y < -50) lf.y = H+50; else if (lf.y > H+50) lf.y = -50;
    }
  }

  function drawLeafShape(g, sz, bend, colors) {
    const [body, lite, dark] = colors;
    // 잎몸: 끝이 뾰족한 잎맥 곡선
    g.fillStyle = body;
    g.beginPath();
    g.moveTo(-sz*0.5, 0);
    g.quadraticCurveTo(0, -sz*bend, sz*0.52, 0);
    g.quadraticCurveTo(0, sz*bend, -sz*0.5, 0);
    g.closePath();
    g.fill();
    // 한쪽 면의 그늘 (입체감)
    g.fillStyle = dark;
    g.globalAlpha = 0.4;
    g.beginPath();
    g.moveTo(-sz*0.5, 0);
    g.quadraticCurveTo(0, sz*bend, sz*0.52, 0);
    g.quadraticCurveTo(0, sz*bend*0.35, -sz*0.5, 0);
    g.closePath();
    g.fill();
    g.globalAlpha = 1;
    // 주맥: 잎끝으로 갈수록 가늘어지는, 살짝 휜 곡선
    g.strokeStyle = lite;
    g.lineCap = 'round';
    g.globalAlpha = 0.85;
    g.lineWidth = Math.max(sz*0.032, 0.8);
    g.beginPath();
    g.moveTo(-sz*0.48, 0);
    g.quadraticCurveTo(0, -sz*0.015, sz*0.28, -sz*0.008);
    g.stroke();
    g.lineWidth = Math.max(sz*0.018, 0.5);
    g.beginPath();
    g.moveTo(sz*0.28, -sz*0.008);
    g.quadraticCurveTo(sz*0.4, -sz*0.004, sz*0.5, 0);
    g.stroke();

    // 측맥: 잎끝을 향해 활처럼 휘어 오르고, 끝으로 갈수록 짧아짐
    // 좌우가 살짝 어긋나며(어긋나기), 잎 가장자리에 닿기 전에 흐려짐
    g.lineWidth = Math.max(sz*0.014, 0.45);
    const veinN = 5;
    for (let i = 0; i < veinN; i++) {
      const bt = -0.34 + i * 0.155;               // 주맥 위 출발점
      const reach = 1 - i / (veinN + 1.5);        // 끝으로 갈수록 짧게
      for (const side of [-1, 1]) {
        const off = side === 1 ? 0.035 : 0;       // 좌우 어긋나기
        const x0 = sz * (bt + off);
        const len = sz * 0.32 * reach;
        const rise = sz * bend * 0.72 * reach;
        // 잎끝 방향으로 활처럼 휘는 곡선
        g.globalAlpha = 0.5;
        g.beginPath();
        g.moveTo(x0, 0);
        g.quadraticCurveTo(
          x0 + len * 0.35, side * -rise * 0.75,
          x0 + len * 1.05, side * -rise * 0.92
        );
        g.stroke();
        // 맥 끝의 잔가지 한 가닥 (자연스러운 마무리)
        if (reach > 0.45) {
          g.globalAlpha = 0.28;
          g.lineWidth = Math.max(sz*0.009, 0.35);
          g.beginPath();
          g.moveTo(x0 + len * 0.55, side * -rise * 0.55);
          g.quadraticCurveTo(
            x0 + len * 0.85, side * -rise * 0.75,
            x0 + len * 1.15, side * -rise * 0.7
          );
          g.stroke();
          g.lineWidth = Math.max(sz*0.014, 0.45);
        }
      }
    }
    g.globalAlpha = 1;
    // 잎자루
    g.strokeStyle = dark;
    g.lineWidth = Math.max(sz*0.035, 0.8);
    g.beginPath();
    g.moveTo(-sz*0.5, 0);
    g.lineTo(-sz*0.62, sz*0.05);
    g.stroke();
  }

  function drawLeaves() {
    for (const lf of leaves) {
      if (lf.falling) {
        // 팔랑팔랑 낙하: 좌우로 크게 흔들리며 내려옴
        const p = lf.fallT / lf.fallDur;
        const ease = p*p*(3-2*p);
        const sway = Math.sin(lf.fallT*0.004 + lf.swayPh) * (1-ease) * lf.size * 2.6;
        const drop = (1-ease) * H * 0.3;
        const tilt = Math.sin(lf.fallT*0.004 + lf.swayPh + Math.PI/2) * (1-ease) * 0.9;
        octx.save();
        octx.translate(lf.landX + sway, lf.landY - drop);
        octx.rotate(lf.rot + tilt);
        const squash = 0.55 + 0.45*Math.abs(Math.cos(lf.fallT*0.005));
        octx.scale(1, squash);
        octx.globalAlpha = 0.55 + ease*0.45;
        drawLeafShape(octx, lf.size, lf.bend, lf.colors);
        octx.restore();
        octx.globalAlpha = 1;
        continue;
      }
      const [gx, gy, h] = sampleGrad(lf.x, lf.y);
      const tilt = gx * 0.01;
      const bob = h * 0.05;
      octx.save();
      octx.translate(lf.x, lf.y + bob);
      octx.rotate(lf.rot + tilt);
      // 잎 그림자: 수면에 얕게
      octx.globalAlpha = 0.22;
      octx.fillStyle = '#141c26';
      octx.beginPath();
      octx.ellipse(lf.size*0.05, lf.size*0.1, lf.size*0.52, lf.size*lf.bend*0.9, 0, 0, Math.PI*2);
      octx.fill();
      octx.globalAlpha = 1;
      drawLeafShape(octx, lf.size, lf.bend, lf.colors);
      octx.restore();
    }
  }

  /* ---------- 송사리: 물속을 헤엄치는 작은 물고기 ---------- */
  const fishes = [];
  const FISH_N = 11;
  let lastSplash = { x: -9999, y: -9999, t: -9999 };
  // 처음부터 두 무리로 모여 출발 (송사리는 떼로)
  const schoolSeeds = [
    { x: rand(W*0.22, W*0.42), y: rand(H*0.28, H*0.55), ang: rand(0, Math.PI*2) },
    { x: rand(W*0.55, W*0.78), y: rand(H*0.38, H*0.72), ang: rand(0, Math.PI*2) }
  ];
  for (let i = 0; i < FISH_N; i++) {
    const seed = schoolSeeds[i < Math.ceil(FISH_N / 2) ? 0 : 1];
    const ang0 = seed.ang + rand(-0.45, 0.45);
    fishes.push({
      x: seed.x + rand(-55, 55), y: seed.y + rand(-42, 42),
      ang: ang0,
      speed: rand(0.35, 0.58),     // 중간 몸집에 맞춘 유영 속도
      dart: 0,                     // 화들짝 가속 (감쇠)
      startle: 0,                  // 파르르 놀란 떨림 남은 시간(ms)
      turnT: rand(900, 2600),      // 다음 방향 전환까지
      turnTo: ang0,
      ph: rand(0, Math.PI*2),      // 꼬리 위상
      glintPh: rand(0, Math.PI*2), // 비늘 반짝임 위상
      sparkX: rand(-0.02, 0.22),   // 반짝임 위치 (프레임마다 튀지 않게 고정)
      size: rand(40, 58) * Math.min(W, H) / 900 + 22,  // 기존↔2배 중간 (~1.45×)
      // 자연 송사리 톤 패밀리 내 미세 변이 (올리브·앰버·은녹)
      morph: (() => { const r = Math.random(); return r < 0.4 ? 0 : r < 0.72 ? 1 : 2; })(),
      markSeed: Math.random(),     // 개체별 얼룩/측선 위치 고정
      depth: rand(0.82, 1)         // 수심감: 살짝 흐리거나 진하게
    });
  }

  function angDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    return d;
  }

  function updateFish(dt, t) {
    const k = dt/16.7;
    const SCHOOL_R = 175;   // 무리 인식 반경
    const SEP_R_MUL = 0.42; // 겹침만 피하고 떼는 유지

    for (let i = 0; i < fishes.length; i++) {
      const f = fishes[i];
      // 이따금 느긋하게 방향 바꾸기 (급선회 대신 완만한 곡선)
      f.turnT -= dt;
      if (f.turnT <= 0 && f.startle <= 0) {
        f.turnTo = f.ang + rand(-0.85, 0.85);
        f.turnT = rand(1600, 4200);
      }

      // 물장구에 화들짝: 파르르 놀라며 도망 (순간 스냅 금지, 빠른 선회+펄럭)
      if (t - lastSplash.t < 950) {
        const dx = f.x - lastSplash.x, dy = f.y - lastSplash.y;
        const d2 = dx*dx + dy*dy;
        const R = 250;
        if (d2 < R*R && d2 > 1) {
          const d = Math.sqrt(d2);
          const near = 1 - d / R;
          // 처음 놀랄 때만 도망 각도 고정 (매 프레임 랜덤으로 안 떨림)
          if (f.startle <= 0) {
            f.turnTo = Math.atan2(dy, dx) + rand(-0.35, 0.35);
            f.startle = 420 + near * 520; // 파르르 놀란 떨림 더 길게
          }
          // 가까운 물고기일수록 기민하게 선회·돌진 (텔레포트 없이)
          f.ang += angDiff(f.turnTo, f.ang) * (0.32 + near * 0.48) * k;
          f.dart = Math.max(f.dart, (3.4 + near * 2.1) * Math.pow(near, 0.55));
        }
      }
      if (f.startle > 0) f.startle = Math.max(0, f.startle - dt);

      // 가장자리 회피: 매 프레임 랜덤 덮어쓰기 대신 안쪽으로 부드럽게 편향
      const m = 90;
      let edgeBiasX = 0, edgeBiasY = 0;
      if (f.x < m) edgeBiasX += (m - f.x) / m;
      else if (f.x > W - m) edgeBiasX -= (f.x - (W - m)) / m;
      if (f.y < m) edgeBiasY += (m - f.y) / m;
      else if (f.y > H - m) edgeBiasY -= (f.y - (H - m)) / m;
      if (edgeBiasX || edgeBiasY) {
        const edgeAng = Math.atan2(edgeBiasY, edgeBiasX);
        f.turnTo = f.turnTo + angDiff(edgeAng, f.turnTo) * 0.18;
      }

      // 떼 짓기: 응집 + 정렬 (너무 가까운 건 아래에서 분리)
      let nNear = 0, cx = 0, cy = 0, ax = 0, ay = 0;
      for (let j = 0; j < fishes.length; j++) {
        if (j === i) continue;
        const o = fishes[j];
        const dx = o.x - f.x, dy = o.y - f.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < SCHOOL_R * SCHOOL_R) {
          nNear++;
          cx += o.x; cy += o.y;
          ax += Math.cos(o.ang); ay += Math.sin(o.ang);
        }
      }
      if (nNear > 0 && f.startle <= 0) {
        const mx = cx / nNear, my = cy / nNear;
        const coh = Math.atan2(my - f.y, mx - f.x);
        const ali = Math.atan2(ay, ax);
        f.turnTo = f.turnTo + angDiff(coh, f.turnTo) * 0.085;
        f.turnTo = f.turnTo + angDiff(ali, f.turnTo) * 0.11;
        // 무리 중심에서 멀면 살짝 따라잡기
        const gap = Math.hypot(mx - f.x, my - f.y);
        if (gap > 70) f.dart = Math.max(f.dart, Math.min(0.55, (gap - 70) * 0.004));
      }

      // 서로 너무 겹치지 않게 살짝 밀어내기 (떼는 유지)
      for (let j = i + 1; j < fishes.length; j++) {
        const o = fishes[j];
        const dx = f.x - o.x, dy = f.y - o.y;
        const minD = (f.size + o.size) * SEP_R_MUL;
        const d2 = dx*dx + dy*dy;
        if (d2 > 1 && d2 < minD*minD) {
          const d = Math.sqrt(d2);
          const push = (minD - d) * 0.014 * k;
          const nx = dx / d, ny = dy / d;
          f.x += nx * push * o.size;
          f.y += ny * push * o.size;
          o.x -= nx * push * f.size;
          o.y -= ny * push * f.size;
          f.turnTo = f.turnTo + angDiff(Math.atan2(ny, nx), f.turnTo) * 0.05;
          o.turnTo = o.turnTo + angDiff(Math.atan2(-ny, -nx), o.turnTo) * 0.05;
        }
      }

      // 선회: 평소엔 느리게, 화들짝·도망칠 땐 기민하게
      const startled = f.startle > 0 ? 0.18 : 0;
      const turnRate = 0.02 + Math.min(f.dart, 3.8) * 0.032 + startled;
      f.ang += angDiff(f.turnTo, f.ang) * turnRate * k;
      f.dart *= Math.pow(0.95, k);

      const sp = f.speed + f.dart;
      f.x += Math.cos(f.ang) * sp * k;
      f.y += Math.sin(f.ang) * sp * k;
      // 꼬리 박동: 평소 자연스럽게, 놀라면 파르르 빠르게
      const flutter = f.startle > 0 ? 0.042 : 0;
      f.ph += dt * (0.0065 + sp * 0.0045 + f.dart * 0.006 + flutter);
    }
  }

  function drawFish(t) {
    // 조감 송사리 — 아주 날씬한 올챙이형 (길이:폭 ≈ 8:1, 머리 쪽 살짝 볼륨)
    const order = fishes.slice().sort((a, b) => a.depth - b.depth);
    // morph 팔레트: 반투명 올리브·앰버·은녹 (납작한 단색 갈색 지양)
    const MORPHS = [
      { flank: '#5a4a36', pale: '#8a7355', dorsal: '#3a3024', belly: '#7a6550', mottle: '#4a3c2c', undertone: 'rgba(138,158,128,0.34)', lateral: 'rgba(55,48,38,0.35)', fin: 'rgba(90,74,54,0.28)', alphaMul: 0.9, dorsalA: 0.42 },
      { flank: '#4e4030', pale: '#756048', dorsal: '#2e261c', belly: '#6a5844', mottle: '#3d3226', undertone: 'rgba(120,145,125,0.3)', lateral: 'rgba(48,42,34,0.38)', fin: 'rgba(78,64,48,0.26)', alphaMul: 0.88, dorsalA: 0.48 },
      { flank: '#6a553c', pale: '#9a8060', dorsal: '#453828', belly: '#8a7055', mottle: '#564636', undertone: 'rgba(155,170,140,0.32)', lateral: 'rgba(62,52,40,0.32)', fin: 'rgba(106,85,60,0.24)', alphaMul: 0.86, dorsalA: 0.4 }
    ];
    for (const f of order) {
      const sz = f.size;
      const startled = f.startle > 0;
      const sAmt = startled ? Math.min(1, f.startle / 220) : 0;
      const wagAmp = 0.2 + Math.min(f.dart, 3.8) * 0.17 + sAmt * 0.48;
      const flutter = startled ? Math.sin(f.ph * 3.8) * (0.045 + sAmt * 0.07) : 0;
      const bodyShake = startled ? Math.sin(f.ph * 5.2) * sz * 0.018 * sAmt : 0;
      const m = MORPHS[f.morph] || MORPHS[2];
      const seed = f.markSeed || 0.5;
      const fract = (x) => x - Math.floor(x);

      octx.save();
      octx.translate(f.x + bodyShake, f.y);
      octx.rotate(f.ang + flutter);

      const alpha = (0.68 + f.depth * 0.22) * m.alphaMul;

      // 물속 그림자 — 몸과 같은 가느다란 실루엣
      octx.globalAlpha = 0.1 * f.depth;
      octx.fillStyle = '#10161e';
      octx.beginPath();
      octx.ellipse(sz * 0.02, sz * 0.06, sz * 0.42, sz * 0.052, 0, 0, Math.PI * 2);
      octx.fill();
      octx.globalAlpha = alpha;

      // 척추: 머리(+x) → 꼬리(-x). 날씬한 올챙이 — 앞몸 살짝 볼륨, 바늘 꼬리 유지
      const segs = 14;
      const spine = [];
      for (let i = 0; i <= segs; i++) {
        const u = i / segs;
        const x = sz * (0.48 - u * 0.92); // 코~꼬리, 길이 ≈ 0.92·sz
        const lag = u * 2.35;
        const amp = wagAmp * sz * (0.008 + u * u * 0.12);
        const y = Math.sin(f.ph - lag) * amp;
        // halfW max ≈ 0.058·sz → 전폭 ≈ 0.116·sz → 길이:폭 ≈ 7.9:1
        // 어깨가 살짝 두껍고 중후반으로 매끈히 가늘어짐 (막대기감 완화, 통통한 타원 아님)
        let halfW;
        if (u < 0.07) halfW = sz * (0.016 + (u / 0.07) * 0.032);        // 코 끝 → 머리
        else if (u < 0.20) halfW = sz * (0.048 + ((u - 0.07) / 0.13) * 0.01); // 머리~어깨 최대
        else if (u < 0.42) halfW = sz * (0.058 - ((u - 0.20) / 0.22) * 0.016); // 앞몸 완만 테이퍼
        else if (u < 0.82) halfW = sz * (0.042 - ((u - 0.42) / 0.40) * 0.022); // 중후반 → 바늘 직전
        else halfW = sz * (0.02 - ((u - 0.82) / 0.18) * 0.012);               // 바늘 꼬리 (유지)
        spine.push({ x, y, halfW, u });
      }

      function sidePoint(i, sign) {
        const s = spine[i];
        const prev = spine[Math.max(0, i - 1)];
        const next = spine[Math.min(spine.length - 1, i + 1)];
        const tx = next.x - prev.x, ty = next.y - prev.y;
        const len = Math.hypot(tx, ty) || 1;
        const nx = -ty / len, ny = tx / len;
        return { x: s.x + nx * s.halfW * sign, y: s.y + ny * s.halfW * sign };
      }

      function strokeSpine(fromI, toI, widthMul, yOff) {
        octx.lineWidth = Math.max(sz * widthMul, 0.55);
        octx.beginPath();
        for (let i = fromI; i <= toI; i++) {
          const s = spine[i];
          const prev = spine[Math.max(0, i - 1)];
          const next = spine[Math.min(spine.length - 1, i + 1)];
          const tx = next.x - prev.x, ty = next.y - prev.y;
          const len = Math.hypot(tx, ty) || 1;
          const nx = -ty / len, ny = tx / len;
          const px = s.x + nx * yOff, py = s.y + ny * yOff;
          if (i === fromI) octx.moveTo(px, py);
          else octx.lineTo(px, py);
        }
        octx.stroke();
      }

      // 몸통 실루엣 (핵심)
      octx.beginPath();
      for (let i = 0; i < spine.length; i++) {
        const p = sidePoint(i, 1);
        if (i === 0) octx.moveTo(p.x, p.y);
        else octx.lineTo(p.x, p.y);
      }
      for (let i = spine.length - 1; i >= 0; i--) {
        const p = sidePoint(i, -1);
        octx.lineTo(p.x, p.y);
      }
      octx.closePath();
      octx.fillStyle = m.flank;
      octx.fill();

      // 클리핑 안: 등·배·얼룩·측선·은녹 undertone (단색 평면감 제거)
      octx.save();
      octx.clip();

      // 등쪽 어두운 톤 (부드러운 등 밴드)
      octx.lineCap = 'round';
      octx.lineJoin = 'round';
      octx.strokeStyle = m.dorsal;
      octx.globalAlpha = alpha * 0.22;
      strokeSpine(1, spine.length - 2, 0.07, 0);
      octx.globalAlpha = alpha * m.dorsalA;
      strokeSpine(1, spine.length - 2, 0.032, 0);

      // 옆구리·배 가장자리 밝은 앰버
      octx.strokeStyle = m.belly;
      octx.globalAlpha = alpha * 0.34;
      strokeSpine(2, spine.length - 3, 0.028, sz * 0.028);
      strokeSpine(2, spine.length - 3, 0.028, -sz * 0.028);
      octx.strokeStyle = m.pale;
      octx.globalAlpha = alpha * 0.22;
      strokeSpine(2, spine.length - 3, 0.016, sz * 0.038);
      strokeSpine(2, spine.length - 3, 0.016, -sz * 0.038);

      // 은녹 undertone — 중부 옆구리 살짝
      octx.globalAlpha = alpha * 0.55;
      octx.fillStyle = m.undertone;
      for (let k = 0; k < 3; k++) {
        const u = 0.22 + fract(seed * (2.1 + k * 1.7)) * 0.45;
        const si = Math.max(2, Math.min(spine.length - 3, Math.floor(u * segs)));
        const side = fract(seed * (4.3 + k)) > 0.5 ? 1 : -1;
        const p = sidePoint(si, side);
        octx.beginPath();
        octx.ellipse(p.x * 0.55 + spine[si].x * 0.45, p.y * 0.55 + spine[si].y * 0.45,
          sz * (0.07 + fract(seed * (5.1 + k)) * 0.04), sz * 0.012, 0, 0, Math.PI * 2);
        octx.fill();
      }

      // 부드러운 얼룩(mottle) — 개체별 고정
      octx.fillStyle = m.mottle;
      for (let k = 0; k < 6; k++) {
        const u = 0.14 + fract(seed * (7.3 + k * 2.9)) * 0.62;
        const si = Math.max(2, Math.min(spine.length - 3, Math.floor(u * segs)));
        const side = fract(seed * (11.1 + k * 3.3)) > 0.48 ? 1 : -1;
        const off = 0.25 + fract(seed * (13.7 + k)) * 0.55;
        const p = sidePoint(si, side);
        const cx = spine[si].x * (1 - off) + p.x * off;
        const cy = spine[si].y * (1 - off) + p.y * off;
        octx.globalAlpha = alpha * (0.1 + fract(seed * (17.2 + k)) * 0.14);
        octx.beginPath();
        octx.ellipse(cx, cy,
          sz * (0.035 + fract(seed * (19.5 + k)) * 0.03),
          sz * (0.008 + fract(seed * (21.1 + k)) * 0.006),
          fract(seed * (23 + k)) * 0.6 - 0.3, 0, Math.PI * 2);
        octx.fill();
      }

      // 희미한 측선 힌트
      octx.strokeStyle = m.lateral;
      octx.globalAlpha = alpha * 0.38;
      const latOff = (fract(seed * 31.7) > 0.5 ? 1 : -1) * sz * 0.018;
      strokeSpine(2, spine.length - 3, 0.01, latOff);

      // 한쪽 옆구리 소프트 하이라이트
      const hiSign = fract(seed * 41.3) > 0.5 ? 1 : -1;
      octx.strokeStyle = m.pale;
      octx.globalAlpha = alpha * 0.2;
      strokeSpine(3, Math.floor(segs * 0.55), 0.014, hiSign * sz * 0.022);

      octx.restore();
      octx.globalAlpha = alpha;

      // 가장자리 살짝 밝은 톤 (얇은 하이라이트)
      octx.globalAlpha = alpha * 0.3;
      octx.strokeStyle = m.pale;
      octx.lineWidth = Math.max(sz * 0.011, 0.55);
      octx.lineCap = 'round';
      octx.beginPath();
      for (let i = 1; i < spine.length - 1; i++) {
        const p = sidePoint(i, 1);
        if (i === 1) octx.moveTo(p.x, p.y);
        else octx.lineTo(p.x, p.y);
      }
      octx.stroke();
      octx.beginPath();
      for (let i = 1; i < spine.length - 1; i++) {
        const p = sidePoint(i, -1);
        if (i === 1) octx.moveTo(p.x, p.y);
        else octx.lineTo(p.x, p.y);
      }
      octx.stroke();

      // 등 정중선 — 옅은 등선 (클리핑 밴드 위에 한 줄)
      octx.globalAlpha = alpha * m.dorsalA * 0.85;
      octx.strokeStyle = m.dorsal;
      octx.lineWidth = Math.max(sz * 0.014, 0.6);
      octx.beginPath();
      for (let i = 1; i < spine.length - 1; i++) {
        if (i === 1) octx.moveTo(spine[i].x, spine[i].y);
        else octx.lineTo(spine[i].x, spine[i].y);
      }
      octx.stroke();
      octx.globalAlpha = alpha;

      // 가슴지느러미: 거의 투명한 작은 힌트
      const pec = spine[Math.floor(segs * 0.2)];
      const pecFlap = 0.4 + Math.sin(f.ph * 1.25) * (0.15 + sAmt * 0.28);
      for (const sign of [-1, 1]) {
        octx.save();
        octx.translate(pec.x, pec.y);
        octx.rotate(sign * pecFlap);
        octx.fillStyle = m.fin;
        octx.globalAlpha = alpha * 0.35;
        octx.beginPath();
        octx.moveTo(sz * 0.01, 0);
        octx.quadraticCurveTo(sz * 0.005, sign * sz * 0.04, -sz * 0.03, sign * sz * 0.055);
        octx.quadraticCurveTo(-sz * 0.01, sign * sz * 0.015, sz * 0.01, 0);
        octx.fill();
        octx.restore();
      }
      octx.globalAlpha = alpha;

      // 꼬리: 가느다란 바늘 끝 + 살짝만 벌어지는 투명 미엽
      const tip = spine[spine.length - 1];
      const tipPrev = spine[spine.length - 2];
      const tdx = tip.x - tipPrev.x, tdy = tip.y - tipPrev.y;
      const tlen = Math.hypot(tdx, tdy) || 1;
      const tux = tdx / tlen, tuy = tdy / tlen;
      const wag = Math.sin(f.ph) * wagAmp * (0.9 + sAmt * 1.1);
      octx.save();
      octx.translate(tip.x, tip.y);
      octx.rotate(Math.atan2(tuy, tux) + wag * 0.55);
      octx.fillStyle = m.fin;
      octx.globalAlpha = alpha * 0.4;
      octx.beginPath();
      octx.moveTo(sz * 0.01, 0);
      octx.quadraticCurveTo(-sz * 0.03, -sz * 0.01, -sz * 0.1, -sz * 0.045);
      octx.quadraticCurveTo(-sz * 0.05, -sz * 0.008, -sz * 0.055, 0);
      octx.quadraticCurveTo(-sz * 0.05, sz * 0.008, -sz * 0.1, sz * 0.045);
      octx.quadraticCurveTo(-sz * 0.03, sz * 0.01, sz * 0.01, 0);
      octx.closePath();
      octx.fill();
      octx.restore();
      octx.globalAlpha = alpha;

      // 은빛 반짝임 — 꼬리 wag 순간에만 비늘 반사 (상시 반짝임 아님)
      const wagPhase = Math.sin(f.ph);
      const wagFlash = Math.abs(wagPhase) * wagAmp * (0.7 + sAmt * 1.15);
      if (wagFlash > 0.14) {
        const ga = Math.min((wagFlash - 0.14) * 1.35, 0.58);
        // 꼬리 쪽 옆구리 + 중부 등선에 짧은 은빛 스트릭
        const rear = spine[Math.floor(segs * 0.62)];
        const mid = spine[Math.floor(segs * 0.42)];
        octx.fillStyle = 'rgba(210,225,235,' + (ga * alpha * 0.72) + ')';
        octx.beginPath();
        octx.ellipse(rear.x + f.sparkX * sz * 0.15, rear.y, sz * 0.14, sz * 0.01, wagPhase * 0.2, 0, Math.PI * 2);
        octx.fill();
        octx.fillStyle = 'rgba(235,242,248,' + (ga * alpha * 0.45) + ')';
        octx.beginPath();
        octx.ellipse(mid.x, mid.y, sz * 0.1, sz * 0.007, 0, 0, Math.PI * 2);
        octx.fill();
      }

      // 눈: 머리 양옆 (기존 대비 2×)
      const eye = spine[Math.floor(segs * 0.09)];
      const er = Math.max(sz * 0.0256, 1.44);
      for (const sign of [-1, 1]) {
        const ep = sidePoint(Math.floor(segs * 0.09), sign);
        const ex = eye.x * 0.2 + ep.x * 0.8;
        const ey = eye.y * 0.2 + ep.y * 0.8;
        octx.globalAlpha = Math.min(1, alpha + 0.15);
        octx.fillStyle = '#0e1014';
        octx.beginPath();
        octx.arc(ex, ey, er, 0, Math.PI * 2);
        octx.fill();
      }

      octx.restore();
      octx.globalAlpha = 1;
    }
  }

  /* ---------- 터치 ---------- */
  const hint = document.getElementById('hint');
  let touched = false;
  let lastMx = -1, lastMy = -1;
  function firstTouch() {
    if (!touched) { touched = true; hint.classList.add('gone'); }
  }
  waterC.addEventListener('pointerdown', e => {
    firstTouch();
    disturb(e.clientX, e.clientY, 2, -190);
    lastSplash = { x: e.clientX, y: e.clientY, t: performance.now() };
    lastMx = e.clientX; lastMy = e.clientY;
  });
  waterC.addEventListener('pointermove', e => {
    if (e.buttons === 0 && e.pointerType === 'mouse') return;
    const dx = e.clientX - lastMx, dy = e.clientY - lastMy;
    if (dx*dx + dy*dy < 64) return;
    disturb(e.clientX, e.clientY, 2, -105);
    lastMx = e.clientX; lastMy = e.clientY;
  });
  window.addEventListener('pointerup', () => { lastMx = lastMy = -1; });

  /* ---------- 흘러다니는 햇살 얼룩 ---------- */
  function drawSunlight(t) {
    lctx.clearRect(0, 0, W, H);
    if (reduced) t = 0;   // 모션 최소화 시 고정
    const T = t * 0.00003;
    // 따뜻한 빛 웅덩이 세 개가 아주 천천히 유영
    const blobs = [
      [0.5 + Math.sin(T*1.00)*0.28,      0.42 + Math.cos(T*0.80)*0.22, 0.36, 0.5],
      [0.34 + Math.cos(T*0.63 + 2.1)*0.3, 0.6 + Math.sin(T*0.9 + 1.2)*0.26, 0.28, 0.42],
      [0.7 + Math.sin(T*0.5 + 4.0)*0.24,  0.3 + Math.cos(T*0.7 + 3.3)*0.24, 0.22, 0.36],
    ];
    for (const [fx0, fy0, fr, fa] of blobs) {
      const rg = lctx.createRadialGradient(W*fx0, H*fy0, 0, W*fx0, H*fy0, Math.min(W,H)*fr);
      rg.addColorStop(0, 'rgba(255,222,158,' + fa + ')');
      rg.addColorStop(0.55, 'rgba(255,228,172,' + (fa*0.4) + ')');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = rg;
      lctx.beginPath();
      lctx.ellipse(W*fx0, H*fy0, Math.min(W,H)*fr*1.3, Math.min(W,H)*fr, T*0.5, 0, Math.PI*2);
      lctx.fill();
    }
    // 지나가는 구름 그늘 하나: 빛과 반대로 움직이며 깊이를 더함
    const cx2 = 0.5 + Math.cos(T*0.42 + 1.7)*0.4, cy2 = 0.5 + Math.sin(T*0.36)*0.34;
    const cg = lctx.createRadialGradient(W*cx2, H*cy2, 0, W*cx2, H*cy2, Math.min(W,H)*0.5);
    cg.addColorStop(0, 'rgba(30,44,68,0.3)');
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = cg;
    lctx.beginPath();
    lctx.ellipse(W*cx2, H*cy2, Math.min(W,H)*0.62, Math.min(W,H)*0.44, -T*0.4, 0, Math.PI*2);
    lctx.fill();
  }

  /* ---------- 메인 루프 ---------- */
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(t - last, 50);
    last = t;

    updateRain(dt);
    stepWater();
    renderWater();
    drawSunlight(t);

    octx.clearRect(0, 0, W, H);
    updateFish(dt, t);
    drawFish(t);
    updateLeaves(dt);
    drawLeaves();
    drawRain();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 글귀 ---------- */
  const QUOTES = [
    ['오늘의 화는 이 물결처럼\n번지다가, 조용히 잦아듭니다.', '잔잔해질 거예요'],
    ['물 위에 손끝을 얹던 기억은\n오래도록 마음을 데워 줍니다.', '그 시절의 나에게'],
    ['빗방울 하나에도\n물은 온몸으로 동그라미를 그려요.', '작은 것에도 다정하게'],
    ['흐르는 물은 다투지 않습니다.\n오늘은 물처럼 지나 보내세요.', '유수부쟁선'],
    ['가만히 들여다보면\n마음도 물처럼 맑아집니다.', '고요히, 천천히'],
    ['수고한 하루가 물결에 실려\n동그랗게 멀어져 갑니다.', '오늘은 여기까지'],
    ['넘어진 날에도 물은\n다시 수평을 찾습니다. 당신도요.', '반드시 잔잔해집니다'],
    ['비 오는 날의 물가처럼\n소란해도, 바닥은 고요합니다.', '당신의 깊은 곳'],
    ['둥근 돌은 급류를 탓하지 않고\n조용히 둥글어졌을 뿐입니다.', '시간이 빚는 것들'],
    ['손끝 하나로 번지는 파문처럼\n작은 쉼 하나가 하루를 바꿉니다.', '지금, 쉬어가기'],
  ];
  const qEl = document.getElementById('quote');
  const qLine = document.getElementById('quoteLine');
  const qSub = document.getElementById('quoteSub');
  let qi = Math.random() * QUOTES.length | 0;

  function showQuote() {
    const [line, sub] = QUOTES[qi % QUOTES.length];
    qi++;
    qLine.innerHTML = line.split('\n').join('<br>');
    qSub.textContent = sub;
    qEl.classList.add('show');
    setTimeout(() => qEl.classList.remove('show'), 7000);
    setTimeout(showQuote, 11500);
  }
  setTimeout(showQuote, 3000);

  setTimeout(() => disturb(W*0.5, H*0.45, 2, -165), 700);
})();
</script>
</body>
