<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>8월의 첫눈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #070b16;
    font-family: 'Gowun Batang', serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }
  #skybg {
    position: fixed; inset: 0;
    background: linear-gradient(to bottom, #070b16 0%, #0e1530 55%, #1a2547 100%);
    touch-action: none;
  }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #message {
    position: fixed;
    left: 50%; top: 28%;
    transform: translate(-50%, -50%);
    width: min(84vw, 360px);
    text-align: center;
    color: rgba(242, 245, 253, 0.93);
    font-size: 1.08rem; line-height: 1.95; letter-spacing: 0.04em;
    opacity: 0;
    transition: opacity 2.6s ease;
    pointer-events: none;
    text-shadow: 0 0 20px rgba(150, 170, 255, 0.4), 0 0 40px rgba(7, 11, 22, 0.9);
    word-break: keep-all;
  }
  #message.visible { opacity: 1; }
  #hint {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
    transform: translateX(-50%);
    color: rgba(242, 245, 253, 0.45);
    font-size: 0.8rem; letter-spacing: 0.14em;
    opacity: 0;
    animation: hintFade 8s ease 2s forwards;
    pointer-events: none;
    white-space: nowrap;
  }
  @keyframes hintFade {
    0% { opacity: 0; } 20% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; }
  }
  #sign {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    transform: translateX(-50%);
    color: rgba(242, 245, 253, 0.22);
    font-size: 0.68rem; letter-spacing: 0.3em;
    pointer-events: none;
    font-family: sans-serif;
  }
</style>
</head>
<body>
<div id="skybg"></div>
<canvas id="fx"></canvas>
<canvas id="snowc"></canvas>
<div id="message"></div>
<div id="hint">첫눈 속에 불꽃을 숨겨두었어요 · 하늘을 눌러보세요</div>
<div id="sign">QRIT</div>
<script>
(function () {
  const fxCanvas = document.getElementById('fx');
  const fx = fxCanvas.getContext('2d');
  const snowCanvas = document.getElementById('snowc');
  const sc = snowCanvas.getContext('2d');
  const messageEl = document.getElementById('message');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    for (const [cv, cx] of [[fxCanvas, fx], [snowCanvas, sc]]) {
      cv.width = W * DPR;
      cv.height = H * DPR;
      cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    fx.clearRect(0, 0, W, H);
  }
  resize();
  window.addEventListener('resize', resize);
  /* ---------- 겨울의 문장 ---------- */
  const messages = [
    '한여름의 당신에게, 조금 이른 첫눈을',
    '눈이 내리면 세상이 잠깐 조용해져요',
    '오늘의 소란은 여기 묻어두고 가요',
    '수고한 마음 위에 눈이 소복소복',
    '겨울처럼, 쉬어가도 괜찮아요',
    '첫눈처럼 좋은 일이 당신에게 내리기를',
    '녹지 않는 안부를 보냅니다',
    '이 고요는 당신을 위해 준비했어요'
  ];
  let msgOrder = shuffle([...messages.keys()]);
  let msgIdx = 0;
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  let msgTimer = null;
  function showMessage() {
    messageEl.textContent = messages[msgOrder[msgIdx]];
    msgIdx = (msgIdx + 1) % msgOrder.length;
    if (msgIdx === 0) msgOrder = shuffle(msgOrder);
    messageEl.classList.add('visible');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => messageEl.classList.remove('visible'), 5600);
  }
  /* ---------- 별 ---------- */
  const stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random(), y: Math.random() * 0.85,
      r: Math.random() * 1.1 + 0.3,
      base: Math.random() * 0.4 + 0.15,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.5 + 0.15
    });
  }
  /* ---------- 눈 ---------- */
  const flakes = [];
  const FLAKE_COUNT = reduceMotion ? 0 : 130;
  for (let i = 0; i < FLAKE_COUNT; i++) {
    flakes.push(newFlake(true));
  }
  function newFlake(anywhere) {
    const depth = Math.random();           /* 0 멀리 ~ 1 가까이 */
    return {
      x: Math.random() * 1.1 - 0.05,
      y: anywhere ? Math.random() : -0.03,
      depth,
      r: 0.8 + depth * 2.6,
      vy: (0.25 + depth * 0.65),
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.4 + Math.random() * 0.6,
      swayAmp: 0.15 + depth * 0.45,
      alpha: 0.35 + depth * 0.55
    };
  }
  /* ---------- 불꽃 팔레트: 눈은 희게, 불꽃은 선명하게 ---------- */
  const PALETTES = [
    ['#ff8a8a', '#ffc2c2', '#ff5d5d'],   /* 연빨강 */
    ['#8ee6a0', '#c8f5d0', '#5dd47a'],   /* 연초록 */
    ['#ffd166', '#ffedb0', '#ff9e3d'],   /* 골드 */
    ['#ff8fd0', '#ffc6e8', '#ff5daf'],   /* 핑크 */
    ['#7fd8f0', '#c0f0ff', '#4cc9f0'],   /* 하늘빛 */
    ['#c9a0ff', '#e8d4ff', '#a86ef0'],   /* 라벤더 */
    ['#ffb36b', '#ffdcb8', '#ff8c2e']    /* 코랄 오렌지 */
  ];
  const GOLD = ['#ffd980', '#ffedb8', '#ffbf50'];
  const rockets = [];
  const particles = [];
  const flashes = [];
  function addP(x, y, vx, vy, color, opts) {
    particles.push(Object.assign({
      x, y, vx, vy, color,
      color2: null,
      life: 1, decay: 0.007 + Math.random() * 0.003,
      r: 1.3 + Math.random() * 1.4,
      gravity: 0.011, friction: 0.986,
      flicker: false, sub: null,
      drift: (Math.random() - 0.5) * 0.008
    }, opts || {}));
  }
  function flash(x, y, color, size) {
    flashes.push({ x, y, r: 0, maxR: size || 110, life: 1, color });
  }
  /* ========== 불꽃 타입 (눈송이 포함) ========== */
  /* 눈송이 불꽃 — 여섯 갈래 결정이 하늘에 그려진다 */
  function snowflakeBurst(x, y) {
    flash(x, y, '#cfe4ff', 100);
    const main = '#e8f2ff';
    for (let arm = 0; arm < 6; arm++) {
      const a = (Math.PI * 2 * arm) / 6 - Math.PI / 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      /* 본가지 */
      for (let i = 1; i <= 12; i++) {
        const s = (i / 12) * 2.4;
        addP(x, y, ca * s, sa * s, main, { decay: 0.0055, gravity: 0.004, r: 1.5 });
      }
      /* 곁가지 두 쌍 */
      for (const bf of [0.45, 0.75]) {
        for (const side of [-1, 1]) {
          const ba = a + side * (Math.PI / 5);
          const bca = Math.cos(ba), bsa = Math.sin(ba);
          for (let j = 1; j <= 4; j++) {
            const bs = bf * 2.4 + (j / 4) * 0.55;
            addP(x, y,
              ca * bf * 2.4 * 0.92 + bca * (j / 4) * 0.7,
              sa * bf * 2.4 * 0.92 + bsa * (j / 4) * 0.7,
              main, { decay: 0.0055, gravity: 0.004, r: 1.2 });
          }
        }
      }
    }
    /* 중심 반짝임 */
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * 0.4;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, '#ffffff', { decay: 0.014, r: 1, flicker: true });
    }
  }
  function heartBurst(x, y, palette) {
    flash(x, y, palette[0], 90);
    const pick = () => palette[Math.floor(Math.random() * palette.length)];
    const scale = 2.1;
    for (let i = 0; i < 72; i++) {
      const t = (Math.PI * 2 * i) / 72;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      addP(x, y, (hx / 16) * scale, (hy / 16) * scale, pick(), {
        decay: 0.0055, gravity: 0.006, r: 1.7
      });
    }
  }
  function starBurst(x, y, palette) {
    flash(x, y, palette[0], 90);
    const pick = () => palette[Math.floor(Math.random() * palette.length)];
    const points = [];
    for (let k = 0; k < 5; k++) {
      const outer = -Math.PI / 2 + (Math.PI * 2 * k) / 5;
      const inner = outer + Math.PI / 5;
      points.push([Math.cos(outer), Math.sin(outer), 1]);
      points.push([Math.cos(inner), Math.sin(inner), 0.45]);
    }
    for (let seg = 0; seg < 10; seg++) {
      const [ax, ay, ar] = points[seg];
      const [bx, by, br] = points[(seg + 1) % 10];
      for (let j = 0; j < 8; j++) {
        const f = j / 8;
        const px = (ax * ar) * (1 - f) + (bx * br) * f;
        const py = (ay * ar) * (1 - f) + (by * br) * f;
        addP(x, y, px * 2.3, py * 2.3, pick(), { decay: 0.006, gravity: 0.005, r: 1.6 });
      }
    }
  }
  function spiralBurst(x, y, palette) {
    flash(x, y, palette[0], 100);
    for (let a = 0; a < 3; a++) {
      const armColor = palette[a % palette.length];
      const armBase = (Math.PI * 2 * a) / 3;
      for (let i = 0; i < 26; i++) {
        const f = i / 26;
        const angle = armBase + f * 2.6;
        const speed = 0.5 + f * 2.1;
        addP(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, armColor, {
          decay: 0.0055, gravity: 0.004, friction: 0.982,
          r: 1.2 + f * 1.2, trailGlow: true
        });
      }
    }
  }
  function shiftChrys(x, y) {
    flash(x, y, '#aef0b8', 110);
    for (let i = 0; i < 84; i++) {
      const a = (Math.PI * 2 * i) / 84;
      const s = 1.9 + Math.random() * 0.5;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, '#8ee6a0', {
        color2: '#ff6b6b', decay: 0.0042, trailGlow: true, r: 1.7
      });
    }
  }
  function crossette(x, y, palette) {
    flash(x, y, palette[0], 100);
    const pick = () => palette[Math.floor(Math.random() * palette.length)];
    for (let i = 0; i < 60; i++) {
      const a = (Math.PI * 2 * i) / 60 + Math.random() * 0.1;
      const s = 1.7 * (0.5 + Math.random() * 0.6);
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, pick(), {
        sub: Math.random() < 0.3 ? palette : null, decay: 0.008
      });
    }
  }
  function goldenWaterfall(cx, cy) {
    const span = Math.min(W * 0.7, 400);
    const n = 70;
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1);
      const px = cx - span / 2 + span * f;
      const arc = Math.sin(f * Math.PI) * 26;
      addP(px, cy - arc, (Math.random() - 0.5) * 0.15, 0.15 + Math.random() * 0.25,
        GOLD[Math.floor(Math.random() * GOLD.length)], {
          decay: 0.0028, gravity: 0.02, friction: 0.992,
          flicker: true, r: 1.2 + Math.random(), trailGlow: true
        });
    }
    flash(cx, cy, '#ffd980', 130);
  }
  function miniBurst(x, y, palette) {
    const pick = () => palette[Math.floor(Math.random() * palette.length)];
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 0.5 + Math.random() * 0.9;
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, pick(), {
        decay: 0.013, r: 1 + Math.random(), flicker: true
      });
    }
  }
  /* ---------- 타입 순환 (눈송이 불꽃이 첫 번째) ---------- */
  const TAP_TYPES = ['snowflake', 'heart', 'shift', 'star', 'spiral', 'crossette', 'waterfall'];
  let tapQueue = [...TAP_TYPES];   /* 첫 바퀴는 고정 순서: 첫 탭은 반드시 눈송이 */
  let tapIdx = 0;
  function nextTapType() {
    const t = tapQueue[tapIdx];
    tapIdx++;
    if (tapIdx >= tapQueue.length) { tapQueue = shuffle([...TAP_TYPES]); tapIdx = 0; }
    return t;
  }
  function fireType(type, x, y) {
    const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    if (type === 'snowflake') snowflakeBurst(x, y);
    else if (type === 'heart') heartBurst(x, y, palette);
    else if (type === 'star') starBurst(x, y, palette);
    else if (type === 'spiral') spiralBurst(x, y, palette);
    else if (type === 'shift') shiftChrys(x, y);
    else if (type === 'waterfall') goldenWaterfall(x, Math.min(y, H * 0.4));
    else crossette(x, y, palette);
  }
  function launch(type) {
    const x = W * (0.15 + Math.random() * 0.7);
    const targetY = H * (0.14 + Math.random() * 0.3);
    rockets.push({
      x, y: H + 10, targetY,
      vy: -(H * 0.0045 + Math.random() * H * 0.0015),
      wobble: Math.random() * Math.PI * 2,
      type: type || TAP_TYPES[Math.floor(Math.random() * TAP_TYPES.length)],
      trail: []
    });
  }
  /* ---------- 피날레: 눈의 나라 축포 ---------- */
  function finale() {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => launch('crossette'), i * 240);
    }
    setTimeout(() => fireType('snowflake', W * 0.32, H * 0.26), 1200);
    setTimeout(() => fireType('snowflake', W * 0.68, H * 0.22), 1550);
    setTimeout(() => fireType('heart', W * 0.5, H * 0.3), 1950);
    setTimeout(() => goldenWaterfall(W * 0.5, H * 0.18), 2500);
    setTimeout(showMessage, 3000);
  }
  /* ---------- 자동 발사: 드물게, 고요가 주인공 ---------- */
  let nextAuto = performance.now() + 9000;
  let autoCount = 0;
  function schedule(now) {
    nextAuto = now + 9000 + Math.random() * 7000;
  }
  /* ---------- 터치: 탭 · 꾹 · 드래그(도화선) ---------- */
  const fuses = [];
  function igniteFuse(path) {
    const pts = [path[0]];
    for (let i = 1; i < path.length; i++) {
      const prev = pts[pts.length - 1];
      if (Math.hypot(path[i].x - prev.x, path[i].y - prev.y) >= 10) pts.push(path[i]);
    }
    if (pts.length > 1) fuses.push({ pts, idx: 0 });
  }
  let pressTimer = null;
  let longPressed = false;
  let dragging = false;
  let activePointerId = null;
  let dragPath = [];
  let dragLen = 0;
  const pointerOpts = { passive: false };
  function endDrag(e) {
    clearTimeout(pressTimer);
    if (activePointerId != null) {
      try { fxCanvas.releasePointerCapture?.(activePointerId); } catch (_) {}
      activePointerId = null;
    }
    const wasDragging = dragging;
    dragging = false;
    if (!wasDragging || longPressed) return;
    if (dragLen < 20) {
      fireType(nextTapType(), e.clientX, Math.min(e.clientY, H * 0.78));
    } else {
      igniteFuse(dragPath.slice());
    }
  }
  window.addEventListener('pointerdown', (e) => {
    if (e.isPrimary === false) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    activePointerId = e.pointerId;
    try { (e.target || fxCanvas).setPointerCapture?.(e.pointerId); } catch (_) {}
    try { fxCanvas.setPointerCapture?.(e.pointerId); } catch (_) {}
    longPressed = false;
    dragging = true;
    dragPath = [{ x: e.clientX, y: e.clientY }];
    dragLen = 0;
    pressTimer = setTimeout(() => {
      if (dragLen < 14) { longPressed = true; finale(); }
    }, 450);
  }, pointerOpts);
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    if (activePointerId != null && e.pointerId !== activePointerId) return;
    e.preventDefault();
    const lastP = dragPath[dragPath.length - 1];
    const d = Math.hypot(e.clientX - lastP.x, e.clientY - lastP.y);
    if (d < 6) return;
    dragLen += d;
    dragPath.push({ x: e.clientX, y: e.clientY });
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 0.3 + Math.random() * 0.7;
      addP(e.clientX, e.clientY, Math.cos(a) * s, Math.sin(a) * s,
        GOLD[Math.floor(Math.random() * GOLD.length)], {
          decay: 0.028 + Math.random() * 0.02,
          r: 0.9 + Math.random(), flicker: true, gravity: 0.015
        });
    }
  }, pointerOpts);
  window.addEventListener('pointerup', (e) => {
    if (activePointerId != null && e.pointerId !== activePointerId) return;
    e.preventDefault();
    endDrag(e);
  }, pointerOpts);
  window.addEventListener('pointercancel', (e) => {
    clearTimeout(pressTimer);
    if (activePointerId != null) {
      try { fxCanvas.releasePointerCapture?.(activePointerId); } catch (_) {}
      activePointerId = null;
    }
    dragging = false;
  }, pointerOpts);
  // iOS Safari: block scroll/pull-to-refresh when a stroke is active
  window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) e.preventDefault();
  }, pointerOpts);
  window.addEventListener('touchmove', (e) => {
    if (dragging) e.preventDefault();
  }, pointerOpts);
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  /* ---------- 렌더 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 16.7, 3);
    last = now;
    const t = now * 0.001;
    /* === 불꽃 캔버스: 잔광 페이드 === */
    fx.globalCompositeOperation = 'destination-out';
    fx.fillStyle = 'rgba(0, 0, 0, 0.16)';
    fx.fillRect(0, 0, W, H);
    fx.globalCompositeOperation = 'lighter';
    if (!reduceMotion) {
      if (now > nextAuto) {
        launch();
        schedule(now);
        autoCount++;
        if (autoCount % 2 === 1) setTimeout(showMessage, 1500);
      }
      for (let i = flashes.length - 1; i >= 0; i--) {
        const f = flashes[i];
        f.r += (f.maxR - f.r) * 0.25 * dt;
        f.life -= 0.07 * dt;
        if (f.life <= 0) { flashes.splice(i, 1); continue; }
        const g = fx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        g.addColorStop(0, f.color + '99');
        g.addColorStop(1, 'transparent');
        fx.globalAlpha = f.life * 0.45;
        fx.fillStyle = g;
        fx.beginPath();
        fx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        fx.fill();
      }
      fx.globalAlpha = 1;
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.y += r.vy * dt * 4;
        r.x += Math.sin(now * 0.01 + r.wobble) * 0.3 * dt;
        r.vy *= 0.996;
        fx.globalAlpha = 0.85;
        fx.fillStyle = '#ffe9b8';
        fx.beginPath();
        fx.arc(r.x, r.y, 1.6, 0, Math.PI * 2);
        fx.fill();
        fx.globalAlpha = 1;
        if (r.y <= r.targetY || r.vy > -0.5) {
          fireType(r.type, r.x, r.y);
          rockets.splice(i, 1);
        }
      }
      for (let i = fuses.length - 1; i >= 0; i--) {
        const fu = fuses[i];
        let steps = Math.ceil(1.6 * dt);
        while (steps-- > 0 && fu.idx < fu.pts.length) {
          const pt = fu.pts[fu.idx];
          for (let k = 0; k < 4; k++) {
            const a = Math.random() * Math.PI * 2;
            const s = 0.4 + Math.random() * 1;
            addP(pt.x, pt.y, Math.cos(a) * s, Math.sin(a) * s, '#fff3d6', {
              decay: 0.04, r: 1 + Math.random(), flicker: true
            });
          }
          fu.idx++;
        }
        if (fu.idx >= fu.pts.length) {
          const end = fu.pts[fu.pts.length - 1];
          fireType(nextTapType(), end.x, Math.min(end.y, H * 0.85));
          if (fu.pts.length > 26) {
            const mid = fu.pts[Math.floor(fu.pts.length / 2)];
            setTimeout(() => fireType(nextTapType(), mid.x, Math.min(mid.y, H * 0.85)), 250);
          }
          fuses.splice(i, 1);
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx = p.vx * p.friction + p.drift * dt;
        p.vy = p.vy * p.friction + p.gravity * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) {
          if (p.sub) miniBurst(p.x, p.y, p.sub);
          particles.splice(i, 1);
          continue;
        }
        let alpha = p.life < 0.35 ? p.life / 0.35 : 1;
        if (p.flicker && Math.random() < 0.35) alpha *= 0.2;
        const col = (p.color2 && p.life < 0.55) ? p.color2 : p.color;
        fx.globalAlpha = alpha * 0.95;
        fx.fillStyle = col;
        fx.beginPath();
        fx.arc(p.x, p.y, p.r * (0.55 + p.life * 0.45), 0, Math.PI * 2);
        fx.fill();
      }
      fx.globalAlpha = 1;
    }
    fx.globalCompositeOperation = 'source-over';
    /* === 눈 캔버스: 매 프레임 새로 (또렷한 눈) === */
    sc.clearRect(0, 0, W, H);
    for (const s of stars) {
      const tw = reduceMotion ? 1 : (0.65 + 0.35 * Math.sin(t * s.speed + s.phase));
      sc.globalAlpha = s.base * tw;
      sc.fillStyle = '#eef1fa';
      sc.beginPath();
      sc.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      sc.fill();
    }
    sc.globalAlpha = 1;
    for (const f of flakes) {
      f.y += (f.vy / H) * dt * 1.6;
      f.sway += f.swaySpeed * 0.016 * dt;
      const fxpos = (f.x + Math.sin(f.sway) * f.swayAmp * 0.03) * W;
      const fypos = f.y * H;
      if (f.y > 1.03) Object.assign(f, newFlake(false));
      sc.globalAlpha = f.alpha;
      sc.fillStyle = '#f4f7ff';
      sc.beginPath();
      sc.arc(fxpos, fypos, f.r, 0, Math.PI * 2);
      sc.fill();
    }
    sc.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  /* ---------- 오프닝: 고요한 눈, 그리고 첫 문장 ---------- */
  setTimeout(showMessage, 4200);
  if (reduceMotion) {
    setInterval(showMessage, 11000);
  }
})();
</script>
